format:
    line_width: 120
    tab_size: 4
    use_tabchars: false
    command_case: unchanged
    dangle_parens: true
    separate_ctrl_name_with_space: false
    separate_fn_name_with_space: false
    enable_sort: true
    autosort: false
markup:
    enable_markup: true
    first_comment_is_literal: false
    literal_comment_pattern: "^#?\\s*(Contract|Input|Output|Failure):"
    canonicalize_hashrulers: true
lint:
    disabled_codes: []
    function_pattern: '[A-Z][A-Za-z0-9]+'
    macro_pattern: '[A-Z][A-Za-z0-9]+'
    global_var_pattern: '(?:[a-z][A-Za-z0-9]*|(?:CMAKE|CTEST|CPACK|FSUSBLOG|WASM)_[A-Z0-9_]+)'
    argument_var_pattern: '[a-z][A-Za-z0-9]*'
    local_var_pattern: '[a-z][A-Za-z0-9]*'
    private_var_pattern: '_[a-z][A-Za-z0-9]*'
    public_var_pattern: '(?:[a-z][A-Za-z0-9]*|(?:CMAKE|CTEST|CPACK|FSUSBLOG|WASM)_[A-Z0-9_]+)'
