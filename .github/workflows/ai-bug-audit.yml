name: AI Bug Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static analyzers
        run: |
          pip install ruff bandit semgrep detect-secrets
          pip install google-genai

      - name: Run static analysis
        run: |
          mkdir reports

          ruff . > reports/ruff.txt || true
          bandit -r . > reports/bandit.txt || true
          semgrep scan --config auto > reports/semgrep.txt || true
          detect-secrets scan > reports/secrets.txt || true

      - name: Run Gemini reasoning
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GOOGLE_API_KEY"])

          findings = ""
          for f in os.listdir("reports"):
              with open("reports/"+f) as file:
                  findings += f"\n\n## {f}\n"+file.read()

          prompt = f"""
          Perform a repository security and bug audit.

          This is READ ONLY analysis.

          Goals:
          - identify real bugs
          - identify security risks
          - remove false positives
          - detect architectural flaws

          Static analysis findings:

          {findings}

          Produce a structured report with:

          1. Critical vulnerabilities
          2. Logic bugs
          3. Concurrency issues
          4. Security problems
          5. Reliability risks
          """

          response = client.models.generate_content(
              model="gemini-3.1-pro",
              contents=prompt
          )

          with open("AI_AUDIT_REPORT.md","w") as f:
              f.write(response.text)
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            reports
            AI_AUDIT_REPORT.md
