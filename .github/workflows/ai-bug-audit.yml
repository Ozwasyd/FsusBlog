name: AI Bug Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python & Tools
        run: |
          python -m pip install --upgrade pip
          pip install semgrep detect-secrets google-genai
          mkdir -p reports
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv
          chmod +x osv

      # 运行静态分析
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

      - name: Run Semgrep
        run: semgrep scan --config auto > reports/semgrep.txt || true

      - name: Run OSV Scanner
        run: ./osv . > reports/dependencies.txt || true

      - name: Run Detect Secrets
        run: detect-secrets scan > reports/secrets.txt || true

      - name: Run Gemini AI Audit
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -U google-genai
          
          # 使用 python3 - <<'EOF' 可以防止 Shell 尝试解析脚本内部的 $ 变量
          python3 - <<'EOF'
              import os
              import sys
              from google import genai

              client = genai.Client(api_key=os.environ.get('GOOGLE_API_KEY'))

              reports_dir = 'reports'
              findings_list = []

              if os.path.exists(reports_dir):
                  for filename in os.listdir(reports_dir):
                      file_path = os.path.join(reports_dir, filename)
                      if os.path.isfile(file_path):
                          try:
                              with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                                  findings_list.append(f"## File: {filename}\n{f.read()}")
                          except Exception as e:
                              print(f"Warning: {e}")

              all_findings = "\n\n".join(findings_list) if findings_list else "No data."

              prompt_template = """
              你是一名资深 .NET 安全审计专家。
              项目类型：C# / .NET 10

              任务：分析以下静态分析结果并输出简体中文报告。
              
              静态分析结果：
              {{DATA}}

              请按预定结构输出报告。
              """
              
              final_prompt = prompt_template.replace("{{DATA}}", all_findings)

              try:
                  # 使用稳定或预览版模型 ID
                  response = client.models.generate_content(
                      model='gemini-2.0-flash',
                      contents=final_prompt
                  )
                  
                  with open('AI_AUDIT_REPORT_CN.md', 'w', encoding='utf-8') as out:
                      out.write(response.text)
                  print("Audit successful.")
              except Exception as e:
                  print(f"Error: {e}")
                  sys.exit(1)
          EOF



      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path:
            - reports
            - AI_AUDIT_REPORT_CN.md
