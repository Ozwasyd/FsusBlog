name: Change Contract

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - edited
            - labeled
            - unlabeled
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

jobs:
    change-contract:
        name: Change Contract
        runs-on: ubuntu-latest
        steps:
            - name: Checkout candidate with full review history
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  path: candidate
                  persist-credentials: false
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

            - name: Checkout trusted pull request gate
              if: github.event_name == 'pull_request'
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Checkout trusted pre-push gate
              if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.event.before }}

            - name: Set up the fixed trusted C# format parser SDK
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.401

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24

            - name: Install the selected checker parser without lifecycle scripts
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  checker_root="$GITHUB_WORKSPACE/trusted"
                  if [[ ! -f "$checker_root/tools/governance/check-change-contract.mjs" ]]; then
                    if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      echo "trusted pull request checker is missing" >&2
                      exit 1
                    fi
                    checker_root="$GITHUB_WORKSPACE/candidate"
                  fi
                  parser_root="$checker_root/tools/governance/javascript-format-parser"
                  if [[ -f "$parser_root/package.json" ]]; then
                    npm ci --ignore-scripts --no-audit --no-fund --prefix "$parser_root"
                  fi

            - name: Validate pull request and squash contract
              if: github.event_name == 'pull_request'
              working-directory: trusted
              run: >-
                  node tools/governance/check-change-contract.mjs
                  --root "$GITHUB_WORKSPACE/candidate"
                  --github-event "$GITHUB_EVENT_PATH"

            - name: Exercise trusted pull request checker
              if: github.event_name == 'pull_request'
              working-directory: trusted
              run: node --test tests/tools/change-contract.test.mjs

            - name: Detect trusted pre-push checker
              if: github.event_name == 'push'
              id: trusted-push
              shell: bash
              run: |
                  if [[ -f "$GITHUB_WORKSPACE/trusted/tools/governance/check-change-contract.mjs" ]]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Audit pushed commit range with previous checker
              if: github.event_name == 'push' && steps.trusted-push.outputs.available == 'true'
              working-directory: trusted
              run: >-
                  node tools/governance/check-change-contract.mjs
                  --root "$GITHUB_WORKSPACE/candidate"
                  --github-event "$GITHUB_EVENT_PATH"

            - name: Exercise trusted pre-push checker
              if: github.event_name == 'push' && steps.trusted-push.outputs.available == 'true'
              working-directory: trusted
              run: node --test tests/tools/change-contract.test.mjs

            - name: Bootstrap pushed commit audit
              if: github.event_name == 'push' && steps.trusted-push.outputs.available != 'true'
              working-directory: candidate
              run: >-
                  node tools/governance/check-change-contract.mjs
                  --root "$GITHUB_WORKSPACE/candidate"
                  --github-event "$GITHUB_EVENT_PATH"

            - name: Exercise bootstrap checker
              if: github.event_name == 'push' && steps.trusted-push.outputs.available != 'true'
              working-directory: candidate
              run: node --test tests/tools/change-contract.test.mjs

            - name: Validate repository contract
              if: github.event_name == 'workflow_dispatch'
              working-directory: candidate
              run: >-
                  node tools/governance/check-change-contract.mjs
                  --root "$GITHUB_WORKSPACE/candidate"
                  --repository

            - name: Exercise dispatched repository checker
              if: github.event_name == 'workflow_dispatch'
              working-directory: candidate
              run: node --test tests/tools/change-contract.test.mjs

    history-repair-regression:
        name: History Repair Policy Regression
        runs-on: ubuntu-latest
        steps:
            - name: Checkout candidate with full review history
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
                  path: candidate
                  persist-credentials: false
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24

            - name: Exercise candidate history repair regressions
              working-directory: candidate
              run: node --test tests/tools/generated-output-history-repair-v3.test.mjs
