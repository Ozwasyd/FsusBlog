name: CI dependency repair
on:
  pull_request:
permissions:
  contents: read
jobs:
  lock-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Generate the security update without changing the required CI gate
        shell: bash
        run: |
          dotnet add tests/Integration/FsusBlog.V2.Integration.Tests.csproj package System.Formats.Cbor --version '[9.0.24]' --no-restore
          dotnet restore FsusBlog.V2.slnx --configfile NuGet.Config --source https://api.nuget.org/v3/index.json --force-evaluate
          git diff -- tests/Integration/FsusBlog.V2.Integration.Tests.csproj '**/packages.lock.json'
          # This diagnostic is not validation of committed dependency locks.
          # A clean locked-mode restore remains mandatory in the main CI.
