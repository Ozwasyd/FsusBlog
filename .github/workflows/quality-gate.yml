name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  FSUSBLOG_PLAYWRIGHT_WORKERS: '1'
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}

jobs:
  validate-matrix:
    name: Validate Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: node tools/run-test-matrix.mjs validate
      - run: node tools/run-test-matrix.mjs ci-plan --format github-actions > .tmp/ci-plan.json
      - run: node tools/run-test-matrix.mjs docs --out docs/testing.generated.md
      - run: node tools/run-test-matrix.mjs evidence-plan --out .tmp/release-evidence/test-plan.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validate-matrix
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/ci-plan.json
            .tmp/release-evidence/test-plan.json
            docs/testing.generated.md

  coverage-backend:
    name: Coverage Backend
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./tools/test.sh coverage-backend --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend
          if-no-files-found: ignore
          retention-days: 14
          path: .tmp/coverage/backend-merged/**

  coverage-frontend:
    name: Coverage Frontend
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh coverage-frontend --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/coverage/frontend/**
            src/frontend/coverage/**

  coverage-merge-threshold:
    name: Coverage Merge Threshold
    runs-on: ubuntu-latest
    needs: [coverage-backend, coverage-frontend]
    timeout-minutes: 10
    env:
      FSUSBLOG_COVERAGE_LINE_THRESHOLD: '100'
      FSUSBLOG_COVERAGE_BRANCH_THRESHOLD: '100'
      FSUSBLOG_COVERAGE_METHOD_THRESHOLD: '100'
      FSUSBLOG_BACKEND_COVERAGE_LINE_THRESHOLD: '100'
      FSUSBLOG_BACKEND_COVERAGE_BRANCH_THRESHOLD: '100'
      FSUSBLOG_BACKEND_COVERAGE_METHOD_THRESHOLD: '100'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v7
        with:
          name: coverage-backend
          path: .tmp/coverage/backend-merged
      - uses: actions/download-artifact@v7
        with:
          name: coverage-frontend
          path: .tmp/coverage/frontend
      - run: ./tools/test.sh coverage-merge --no-deps
      - run: ./tools/test.sh coverage-threshold --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-merge-threshold
          if-no-files-found: ignore
          retention-days: 14
          path: .tmp/coverage/**

  fast-backend:
    name: Fast Backend
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./tools/test.sh backend-fast --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-backend
          if-no-files-found: ignore
          retention-days: 14
          path: .tmp/gate-logs/**

  fast-frontend-unit:
    name: Fast Frontend Unit
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh frontend-fast --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-frontend-unit
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src/frontend/coverage/**
            .tmp/frontend/**

  fast-static-governance:
    name: Fast Static Governance
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./tools/test.sh static-governance --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-static-governance
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/gate-logs/**
            .tmp/release-evidence/test-plan.json

  cross-stack-contract:
    name: Cross Stack Contract
    runs-on: ubuntu-latest
    needs: [fast-frontend-unit, fast-static-governance]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh cross-stack-contract --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-stack-contract
          if-no-files-found: ignore
          retention-days: 14
          path: tests/frontend/fixtures/cross-stack-contract-matrix.json

  integration-runtime:
    name: Integration Runtime
    runs-on: ubuntu-latest
    needs: [fast-backend, fast-frontend-unit]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-runtime
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/acceptance/*.log
            src/frontend/test-results/playwright/integration/**

  release-public:
    name: Release Public
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-public
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/acceptance/*.log
            src/frontend/test-results/playwright/release/**

  security-runtime:
    name: Security Runtime
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh security
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-runtime
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/security/**
            src/frontend/test-results/playwright/security/**

  acceptance-playwright:
    name: Acceptance Playwright ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: release-public
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: npm --prefix src/frontend exec -- playwright install --with-deps chromium
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh acceptance --no-deps --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-playwright-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src/frontend/test-results/playwright/acceptance/**
            src/frontend/playwright-report/**

  visual-playwright:
    name: Visual Playwright ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: release-public
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: npm --prefix src/frontend exec -- playwright install --with-deps chromium
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh visual --no-deps --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-playwright-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src/frontend/test-results/playwright/visual/**
            src/frontend/playwright-report/**
            .tmp/gate-logs/visual-gate-skip.json

  ux-viewport-smoke:
    name: UX Viewport Smoke
    runs-on: ubuntu-latest
    needs: release-public
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: npm --prefix src/frontend exec -- playwright install --with-deps chromium
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh ux-viewport-smoke --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ux-viewport-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/ux/**
            .tmp/release-evidence/ux-viewport-summary.json
            src/frontend/test-results/playwright/ux-viewport-smoke/**
            src/frontend/playwright-report/**

  frontend-render-pressure:
    name: Frontend Render Pressure
    runs-on: ubuntu-latest
    needs: release-public
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: npm --prefix src/frontend exec -- playwright install --with-deps chromium
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh frontend-render-pressure --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-render-pressure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/frontend/dom-budget.json
            .tmp/frontend/dom-budget/**
            .tmp/frontend/route-render-pressure.json
            .tmp/frontend/markdown-render-budget.json
            .tmp/frontend/dom-depth-static.json
            .tmp/release-evidence/frontend-render-pressure-summary.json
            src/frontend/test-results/playwright/**
            src/frontend/playwright-report/**

  cross-browser-smoke:
    name: Cross Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: release-public
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      FSUSBLOG_PLAYWRIGHT_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: npm --prefix src/frontend exec -- playwright install --with-deps ${{ matrix.browser }}
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh cross-browser-smoke --no-deps --shard 1/3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-browser-smoke-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14
          path: src/frontend/test-results/playwright/cross-browser/**

  resilience-runtime:
    name: Resilience Runtime
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh resilience
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resilience-runtime
          if-no-files-found: ignore
          retention-days: 14
          path: src/frontend/test-results/playwright/resilience/**

  load-smoke:
    name: Load Smoke
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh load
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: .tmp/perf/**

  perf-regression:
    name: Perf Regression
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./tools/test.sh backend-perf --no-deps
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-regression
          if-no-files-found: ignore
          retention-days: 14
          path: BenchmarkDotNet.Artifacts/results/**

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    needs:
      - coverage-merge-threshold
      - fast-backend
      - fast-frontend-unit
      - fast-static-governance
      - cross-stack-contract
      - integration-runtime
      - release-public
      - security-runtime
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - perf-regression
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v7
        with:
          path: .tmp/downloaded-artifacts
      - run: node tools/run-test-matrix.mjs evidence-plan --out .tmp/release-evidence/test-plan.json
      - run: ./tools/operations/collect-release-evidence.sh
      - run: ./tools/operations/check-release-evidence-manifest.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: .tmp/release-evidence/**

  production-summary:
    name: Production Summary
    runs-on: ubuntu-latest
    needs:
      - coverage-merge-threshold
      - fast-backend
      - fast-frontend-unit
      - fast-static-governance
      - cross-stack-contract
      - integration-runtime
      - release-public
      - security-runtime
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - perf-regression
      - release-evidence
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          failures='${{ toJson(needs) }}'
          node -e "
            const needs = JSON.parse(process.argv[1]);
            const failed = Object.entries(needs).filter(([, value]) => value.result !== 'success');
            if (failed.length) {
              for (const [name, value] of failed) console.error(name + ': ' + value.result);
              process.exit(1);
            }
            console.log('production summary ok');
          " "$failures"
