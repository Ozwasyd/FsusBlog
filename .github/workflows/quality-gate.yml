      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh load
      - run: ./tools/test.sh load-baseline --no-deps
      - run: ./tools/test.sh load-peak --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: load-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/perf/**
            .tmp/release-evidence/perf-summary.json
            .tmp/release-evidence/jobs/**

  backend-qps-collectors:
    name: Backend QPS Collector ${{ matrix.shard_id }}
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.validate-matrix.outputs.backend_qps_collectors_max_parallel) }}
      matrix: ${{ fromJson(needs.validate-matrix.outputs.backend_qps_collectors_matrix) }}
    env:
      FSUSBLOG_TEST_NAMESPACE: ci-backend-qps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh ci-tier ${{ matrix.tier }} --no-deps
        env:
          FSUSBLOG_CI_JOB_ID: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/perf/backend-qps/**
            .tmp/release-evidence/jobs/**

  backend-qps:
    name: Backend QPS Aggregate
    runs-on: ubuntu-latest
    needs: [integration-runtime, backend-qps-collectors]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: backend-qps-collectors-*
          path: .
          merge-multiple: true
      - run: ./tools/test.sh ci-tier backend-qps --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-qps
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/perf/backend-qps/**
            .tmp/release-evidence/backend-qps-summary.json
            .tmp/release-evidence/backend-qps-runtime-sequential-summary.json
            .tmp/release-evidence/jobs/**

  perf-regression:
    name: Perf Regression
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: ./tools/test.sh aeds-frame-cost --no-deps
      - run: ./tools/test.sh aeds-compression-profile --no-deps
      - run: ./tools/test.sh backend-perf --no-deps
      - run: ./tools/test.sh backend-benchmark-regression --no-deps
      - run: ./tools/test.sh browser-performance-regression --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-regression
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/perf/aeds-frame-cost/**
            .tmp/perf/aeds-compression-profile/**
            .tmp/perf/browser-performance.json
            .tmp/release-evidence/aeds-frame-cost-summary.json
            .tmp/release-evidence/aeds-compression-profile-summary.json
            .tmp/release-evidence/perf-summary.json
            .tmp/release-evidence/jobs/**
            BenchmarkDotNet.Artifacts/results/**

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    needs:
      - coverage-merge-threshold
      - fast-backend
      - frontend-build
      - fast-frontend-unit
      - frontend-runtime-contracts
      - frontend-static-governance
      - fast-static-governance
      - fast-summary
      - cross-stack-contract
      - endpoint-depth-runtime
      - integration-runtime
      - release-public
      - security-runtime
      - security-static-fuzz
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - backend-qps
      - perf-regression
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: .tmp/downloaded-artifacts
      - run: ./tools/test.sh release-evidence --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: .tmp/release-evidence/**

  production-summary:
    name: Production Summary
    runs-on: ubuntu-latest
    needs:
      - validate-matrix
      - coverage-backend
      - coverage-frontend
      - coverage-merge-threshold
      - fast-backend
      - frontend-build
      - fast-frontend-unit
      - frontend-runtime-contracts
      - frontend-static-governance
      - fast-static-governance
      - fast-summary
      - cross-stack-contract
      - endpoint-depth-runtime
      - integration-runtime
      - release-public
      - security-runtime
      - security-static-fuzz
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - backend-qps
      - perf-regression
      - release-evidence
    if: always()
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: .tmp/downloaded-artifacts
      - name: Check required job results
        env:
          QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/ci/summarize-quality-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-summary
          if-no-files-found: ignore
          retention-days: 14
          path: .tmp/release-evidence/jobs/**
