    # This job owns both release browser authorities. The general Browser Contract
    # remains fixed Chromium; the XSS authority separately consumes all three engines
    # and the checked-out local FsusUI test-only corpus.
    browser-contract:
        name: Browser Contract
        runs-on: ubuntu-latest
        needs: [validate-matrix, behavior-doc-static-admission, plan-pr-risk, production-build-artifacts, integration-runtime]
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
            (github.event_name == 'pull_request' && needs.plan-pr-risk.outputs.browser_contract == 'true')
        timeout-minutes: 20
        outputs:
            source_fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
            production_receipt_digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
            browser_contract_receipt_digest: ${{ steps.contract_receipt.outputs.receipt_digest }}
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_PLAYWRIGHT_WORKERS: "1"
            FSUSBLOG_BROWSER_CONTRACT_SESSIONS: "1"
            FSUSBLOG_BROWSER_CONTRACT_CONCURRENCY: "1"
            FSUSBLOG_BROWSER_CONTRACT_TIMEOUT: 7m
            FSUSBLOG_BROWSER_CONTRACT_RUN_ID: browser-contract-${{ github.run_id }}-${{ github.run_attempt }}
            FSUSBLOG_BROWSER_CONTRACT_OUTPUT: ${{ github.workspace }}/.tmp/browser-contract
            FSUSBLOG_BROWSER_CONTRACT_BUILD_RECEIPT: ${{ github.workspace }}/.tmp/downloaded-production-build/receipt.json
            FSUSBLOG_TEST_SOURCE_COMMIT: ${{ github.sha }}
            FSUSBLOG_TEST_SOURCE_FINGERPRINT: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
            FSUSBLOG_LOCAL_FSUSUI_ROOT: ${{ github.workspace }}/.tmp/local-fsusui
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - id: fsusui-baseline
              run: node tools/test/fsusui-baseline.mjs --github-output "$GITHUB_OUTPUT"
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  repository: Ozwasyd/FsusUI
                  ref: ${{ steps.fsusui-baseline.outputs.commit }}
                  path: .tmp/local-fsusui
                  token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
                  persist-credentials: false
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
            - run: corepack pnpm --dir "$FSUSBLOG_LOCAL_FSUSUI_ROOT" install --frozen-lockfile --ignore-scripts
            - run: corepack pnpm --dir "$FSUSBLOG_LOCAL_FSUSUI_ROOT" run build:theme
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-release-browser-authorities-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}
            - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend exec -- playwright install --with-deps chromium firefox webkit
            - uses: ./.github/actions/consume-production-build
              with:
                  source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
                  consumer-job: browser-contract
            # The fixture provider owns its dedicated runtime lifecycle. Do not add
            # the shared acceptance bootstrap, another Playwright shard, or retries.
            - name: Run the single release Browser Contract
              run: ./tools/test.sh ci-tier browser-contract --no-deps
            - name: Run the production XSS release browser authority
              run: ./tools/test.sh ci-tier production-xss-release --no-deps
            - name: Validate Browser Contract receipt schema
              env:
                  FSUSBLOG_CI_PRODUCTION_SOURCE_FINGERPRINT: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  FSUSBLOG_CI_PRODUCTION_RECEIPT_DIGEST: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
              run: node tools/release/test-evidence-receipts-cli.mjs validate-browser-contract .tmp/browser-contract/receipt.json
            - id: contract_receipt
              name: Export Browser Contract receipt identity
              run: |
                  # Node source is intentionally single-quoted for the shell.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                    import crypto from "node:crypto";
                    import fs from "node:fs";
                    const file = ".tmp/browser-contract/receipt.json";
                    const bytes = fs.readFileSync(file);
                    const receipt = JSON.parse(bytes);
                    if (receipt.schema !== "fsusblog.browser-contract-receipt.v2") throw new Error(`unexpected Browser Contract receipt schema: ${receipt.schema}`);
                    if (receipt.status !== "success") throw new Error(`Browser Contract receipt is not successful: ${receipt.status}`);
                    if (receipt.sourceState?.commit !== process.env.GITHUB_SHA) throw new Error("Browser Contract receipt commit mismatch");
                    if (receipt.sourceState?.worktreeFingerprint !== process.env.FSUSBLOG_TEST_SOURCE_FINGERPRINT) throw new Error("Browser Contract receipt fingerprint mismatch");
                    if (receipt.build?.receiptContentDigest !== process.env.PRODUCTION_RECEIPT_DIGEST) throw new Error("Browser Contract build receipt digest mismatch");
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, `receipt_digest=sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}\n`);
                  '
              env:
                  PRODUCTION_RECEIPT_DIGEST: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: browser-contract-${{ github.run_id }}-${{ github.run_attempt }}
                  if-no-files-found: ignore
                  retention-days: 14
                  include-hidden-files: true
                  # fixtures/** and runs/** may retain authentication material for
                  # local cleanup/debug recovery and must never cross the runner
                  # artifact boundary. The receipt contains only sealed identities,
                  # classifications and relative evidence paths.
                  path: |
                      .tmp/browser-contract/receipt.json
                      .tmp/release-evidence/public-preview-screenshots.json
                      .tmp/release-evidence/jobs/**
                      src/frontend/test-results/playwright/production-xss-release/matrix.json

