name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  FSUSBLOG_REPO_ROOT: ${{ github.workspace }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}

jobs:
  validate-matrix:
    name: Validate Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acceptance_playwright_matrix: ${{ steps.acceptance_playwright_matrix.outputs.matrix }}
      acceptance_playwright_max_parallel: ${{ steps.acceptance_playwright_matrix.outputs.max_parallel }}
      visual_public_playwright_matrix: ${{ steps.visual_public_playwright_matrix.outputs.matrix }}
      visual_public_playwright_max_parallel: ${{ steps.visual_public_playwright_matrix.outputs.max_parallel }}
      visual_console_playwright_matrix: ${{ steps.visual_console_playwright_matrix.outputs.matrix }}
      visual_console_playwright_max_parallel: ${{ steps.visual_console_playwright_matrix.outputs.max_parallel }}
      backend_qps_collectors_matrix: ${{ steps.backend_qps_collectors_matrix.outputs.matrix }}
      backend_qps_collectors_max_parallel: ${{ steps.backend_qps_collectors_matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - run: node tools/run-test-matrix.mjs preflight
      - run: node tools/run-test-matrix.mjs validate
      - run: node tools/moderation/provider-conformance.mjs --provider schema-only
      - run: node tools/run-test-matrix.mjs ci-plan --format github-actions --out .tmp/ci-plan.json
      - run: node tools/check-workflow-matrix-sync.mjs .tmp/ci-plan.json .github/workflows/quality-gate.yml
      - run: node tools/docs/generate-testing-docs.mjs --check
      - run: node tools/run-test-matrix.mjs evidence-plan --out .tmp/release-evidence/test-plan.json
      - id: acceptance_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix acceptance-playwright --github-output "$GITHUB_OUTPUT"
      - id: visual_public_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix visual-public-playwright --github-output "$GITHUB_OUTPUT"
      - id: visual_console_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix visual-console-playwright --github-output "$GITHUB_OUTPUT"
      - id: backend_qps_collectors_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix backend-qps-collectors --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validate-matrix
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/ci-plan.json
            .tmp/gate-logs/preflight.json
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/test-plan.json
            .tmp/docs/generated-testing-docs.json
            docs/testing.generated.md

  plan-pr-risk:
    name: Plan PR Smart Gate
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 5
    outputs:
      pr_smart_gate_summary: ${{ steps.smart.outputs.pr_smart_gate_summary }}
      coverage_backend: ${{ steps.smart.outputs.coverage_backend }}
      coverage_frontend: ${{ steps.smart.outputs.coverage_frontend }}
      coverage_merge_threshold: ${{ steps.smart.outputs.coverage_merge_threshold }}
      integration_runtime: ${{ steps.smart.outputs.integration_runtime }}
      release_public: ${{ steps.smart.outputs.release_public }}
      security_runtime: ${{ steps.smart.outputs.security_runtime }}
      acceptance_playwright: ${{ steps.smart.outputs.acceptance_playwright }}
      visual_public_playwright: ${{ steps.smart.outputs.visual_public_playwright }}
      visual_console_playwright: ${{ steps.smart.outputs.visual_console_playwright }}
      visual_playwright: ${{ steps.smart.outputs.visual_playwright }}
      cross_browser_smoke: ${{ steps.smart.outputs.cross_browser_smoke }}
      frontend_render_pressure: ${{ steps.smart.outputs.frontend_render_pressure }}
      resilience_runtime: ${{ steps.smart.outputs.resilience_runtime }}
      load_smoke: ${{ steps.smart.outputs.load_smoke }}
      backend_qps_collectors: ${{ steps.smart.outputs.backend_qps_collectors }}
      backend_qps_collectors_matrix: ${{ steps.smart.outputs.backend_qps_collectors_matrix }}
      backend_qps_collectors_max_parallel: ${{ steps.smart.outputs.backend_qps_collectors_max_parallel }}
      backend_qps: ${{ steps.smart.outputs.backend_qps }}
      production_build_artifacts: ${{ steps.smart.outputs.production_build_artifacts }}
      production_build_domains: ${{ steps.smart.outputs.production_build_domains }}
      production_build_domains_json: ${{ steps.smart.outputs.production_build_domains_json }}
      production_summary: ${{ steps.smart.outputs.production_summary }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - name: Collect changed files
        run: |
          mkdir -p .tmp
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" > .tmp/pr-changed-files.txt
          else
            : > .tmp/pr-changed-files.txt
          fi
      - id: smart
        run: |
          node tools/run-test-matrix.mjs ci-pr-plan \
            --changed-files .tmp/pr-changed-files.txt \
            --event-name "${{ github.event_name }}" \
            --base-ref "${{ github.event.pull_request.base.sha || 'origin/master' }}" \
            --out .tmp/pr-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pr-smart-gate
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/pr-plan.json
            .tmp/pr-changed-files.txt
            .tmp/release-evidence/pr-smart-gate-summary.json

  production-build-artifacts:
    name: Immutable Production Build Artifacts
    runs-on: ubuntu-latest
    needs: [validate-matrix, plan-pr-risk]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_build_artifacts == 'true'
    timeout-minutes: 35
    outputs:
      source_fingerprint: ${{ steps.receipt.outputs.source_fingerprint }}
      receipt_digest: ${{ steps.receipt.outputs.receipt_digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier production-build-artifacts --no-deps
        env:
          FSUSBLOG_CI_PRODUCTION_BUILD_DOMAINS: ${{ needs.plan-pr-risk.outputs.production_build_domains }}
      - id: receipt
        name: Export immutable receipt identity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const receipt = JSON.parse(fs.readFileSync(".tmp/ci-production-build/receipt.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_fingerprint=${receipt.sourceState.worktreeFingerprint}\nreceipt_digest=${receipt.contentDigest}\n`);
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-build-artifacts
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
          include-hidden-files: true
          path: |
            .tmp/ci-production-build/**

  coverage-merge-threshold:
    name: Coverage Merge Threshold
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, fast-backend, fast-frontend-unit]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.coverage_merge_threshold == 'true'
    timeout-minutes: 90
    env:
      FSUSBLOG_COVERAGE_LINE_THRESHOLD: '35'
      FSUSBLOG_COVERAGE_BRANCH_THRESHOLD: '20'
      FSUSBLOG_COVERAGE_METHOD_THRESHOLD: '30'
      FSUSBLOG_BACKEND_COVERAGE_LINE_THRESHOLD: '75'
      FSUSBLOG_BACKEND_COVERAGE_BRANCH_THRESHOLD: '55'
      FSUSBLOG_BACKEND_COVERAGE_METHOD_THRESHOLD: '95'
      FSUSBLOG_FRONTEND_COVERAGE_LINE_THRESHOLD: '35'
      FSUSBLOG_FRONTEND_COVERAGE_BRANCH_THRESHOLD: '20'
      FSUSBLOG_FRONTEND_COVERAGE_FUNCTION_THRESHOLD: '30'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-backend
          path: .tmp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-frontend-unit
          path: .
      - run: ./tools/test.sh coverage-merge --no-deps
      - run: ./tools/test.sh coverage-threshold --no-deps
      - run: ./tools/test.sh coverage-gate --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-merge-threshold
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/coverage/**
            .tmp/release-evidence/jobs/**

  fast-backend:
    name: Fast Backend DAG
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: ./tools/test.sh ci-job fast-backend --fresh
        env:
          FSUSBLOG_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/master' }}
          FSUSBLOG_DOTNET_BUILD_PARALLELISM: ${{ vars.FSUSBLOG_DOTNET_BUILD_PARALLELISM || 'safe' }}
          FSUSBLOG_TEST_SELECTION: full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-backend
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/backend-build-governance/**
            .tmp/backend-unit/**
            .tmp/backend-fast/**
            .tmp/backend-api-integration/**
            .tmp/backend-auth-state-machine/**
            .tmp/backend-concurrency/**
            .tmp/backend-golden/**
            .tmp/backend-property/**
            .tmp/coverage/backend/**
            .tmp/coverage/backend-merged/**
            .tmp/release-evidence/integrity-proof-verification.json
            .tmp/release-evidence/jobs/**

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-build --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-build
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**
            src/frontend/dist/**
            src/backend/wwwroot/**

  fast-frontend-unit:
    name: Fast Frontend Unit DAG
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-job fast-frontend-unit --fresh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-frontend-unit
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            src/frontend/coverage/**
            src/frontend/test-results/**
            .tmp/coverage/frontend/**
            .tmp/frontend/**
            .tmp/test-results/vitest/**
            .tmp/ux/viewport-plan-progress.json
            .tmp/release-evidence/jobs/**

  frontend-runtime-contracts:
    name: Frontend Runtime Contracts
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-runtime-contracts --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-runtime-contracts
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**

  frontend-static-governance:
    name: Frontend Static Governance
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-static-governance --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-static-governance
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**

  fast-static-governance:
    name: Fast Static Governance
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - run: node tools/db/migration-doc-lint.mjs
      - run: ./tools/test.sh static-governance --no-deps
      - run: ./tools/test.sh public-hydration-fast --no-deps
      - run: ./tools/test.sh backend-test-governance --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-static-governance
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/gate-logs/**
            .tmp/docs/**
            .tmp/backend-test-governance/**
            .tmp/release-evidence/test-plan.json
            .tmp/release-evidence/doc-sync-summary.json
            .tmp/release-evidence/test-retention-audit.json
            .tmp/release-evidence/public-hydration-matrix-summary.json
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/flaky/**

  fast-summary:
    name: Fast Summary
    runs-on: ubuntu-latest
    needs: [fast-backend, frontend-build, fast-frontend-unit, frontend-runtime-contracts, frontend-static-governance, fast-static-governance]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-backend
          path: .tmp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
          path: .
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-frontend-unit
          path: .
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-runtime-contracts
          path: .tmp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-static-governance
          path: .tmp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-static-governance
          path: .tmp
      - name: Aggregate fast evidence
        env:
          QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/run-test-matrix.mjs aggregate fast-summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-summary
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/backend-fast/**
            .tmp/gate-logs/**
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**
            src/frontend/coverage/**
            src/frontend/dist/**

  cross-stack-contract:
    name: Cross Stack Contract
    runs-on: ubuntu-latest
    needs: [fast-frontend-unit, fast-static-governance]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh cross-stack-contract --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cross-stack-contract
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/release-evidence/jobs/**
            src/frontend/src/generated/fsusBinaryRoutes.ts
            src/shared/Contracts/Validation/fsusblog.openapi.json
            tests/frontend/fixtures/cross-stack-contract-matrix.generated.json
            tests/frontend/fixtures/cross-stack-contract-matrix.json

  integration-runtime:
    name: Integration Runtime
    runs-on: ubuntu-latest
    needs: [validate-matrix, plan-pr-risk, production-build-artifacts, fast-backend, fast-frontend-unit]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.integration_runtime == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: integration-runtime
      - run: ./tools/test.sh integration
      - run: ./tools/test.sh ci-tier rights-v3-test-matrix --no-deps
      - run: ./tools/test.sh data-scale-xs --no-deps
      - run: ./tools/test.sh data-scale-s --no-deps
