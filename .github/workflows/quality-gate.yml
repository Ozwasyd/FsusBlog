name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  FSUSBLOG_REPO_ROOT: ${{ github.workspace }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}

jobs:
  validate-matrix:
    name: Validate Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast_backend_matrix: ${{ steps.fast_backend_matrix.outputs.matrix }}
      fast_backend_max_parallel: ${{ steps.fast_backend_matrix.outputs.max_parallel }}
      fast_frontend_unit_matrix: ${{ steps.fast_frontend_unit_matrix.outputs.matrix }}
      fast_frontend_unit_max_parallel: ${{ steps.fast_frontend_unit_matrix.outputs.max_parallel }}
      acceptance_playwright_matrix: ${{ steps.acceptance_playwright_matrix.outputs.matrix }}
      acceptance_playwright_max_parallel: ${{ steps.acceptance_playwright_matrix.outputs.max_parallel }}
      visual_public_playwright_matrix: ${{ steps.visual_public_playwright_matrix.outputs.matrix }}
      visual_public_playwright_max_parallel: ${{ steps.visual_public_playwright_matrix.outputs.max_parallel }}
      visual_console_playwright_matrix: ${{ steps.visual_console_playwright_matrix.outputs.matrix }}
      visual_console_playwright_max_parallel: ${{ steps.visual_console_playwright_matrix.outputs.max_parallel }}
      ux_viewport_smoke_matrix: ${{ steps.ux_viewport_smoke_matrix.outputs.matrix }}
      ux_viewport_smoke_max_parallel: ${{ steps.ux_viewport_smoke_matrix.outputs.max_parallel }}
      backend_qps_collectors_matrix: ${{ steps.backend_qps_collectors_matrix.outputs.matrix }}
      backend_qps_collectors_max_parallel: ${{ steps.backend_qps_collectors_matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - run: node tools/run-test-matrix.mjs preflight
      - run: node tools/run-test-matrix.mjs validate
      - run: node tools/moderation/provider-conformance.mjs --provider schema-only
      - run: node tools/run-test-matrix.mjs ci-plan --format github-actions --out .tmp/ci-plan.json
      - run: node tools/check-workflow-matrix-sync.mjs .tmp/ci-plan.json .github/workflows/quality-gate.yml
      - run: node tools/run-test-matrix.mjs docs --out docs/testing.generated.md
      - run: node tools/run-test-matrix.mjs evidence-plan --out .tmp/release-evidence/test-plan.json
      - id: fast_backend_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix fast-backend --github-output "$GITHUB_OUTPUT"
      - id: fast_frontend_unit_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix fast-frontend-unit --github-output "$GITHUB_OUTPUT"
      - id: acceptance_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix acceptance-playwright --github-output "$GITHUB_OUTPUT"
      - id: visual_public_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix visual-public-playwright --github-output "$GITHUB_OUTPUT"
      - id: visual_console_playwright_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix visual-console-playwright --github-output "$GITHUB_OUTPUT"
      - id: ux_viewport_smoke_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix ux-viewport-smoke --github-output "$GITHUB_OUTPUT"
      - id: backend_qps_collectors_matrix
        run: node tools/run-test-matrix.mjs ci-job-matrix backend-qps-collectors --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validate-matrix
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/ci-plan.json
            .tmp/gate-logs/preflight.json
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/test-plan.json
            docs/testing.generated.md

  coverage-backend:
    name: Coverage Backend
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: ./tools/test.sh coverage-backend --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-backend
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/coverage/backend/**
            .tmp/coverage/backend-merged/**
            .tmp/release-evidence/jobs/**

  coverage-frontend:
    name: Coverage Frontend
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh coverage-frontend --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-frontend
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/coverage/frontend/**
            .tmp/release-evidence/jobs/**
            src/frontend/coverage/**

  coverage-merge-threshold:
    name: Coverage Merge Threshold
    runs-on: ubuntu-latest
    needs: [coverage-backend, coverage-frontend]
    timeout-minutes: 90
    env:
      FSUSBLOG_COVERAGE_LINE_THRESHOLD: '35'
      FSUSBLOG_COVERAGE_BRANCH_THRESHOLD: '20'
      FSUSBLOG_COVERAGE_METHOD_THRESHOLD: '30'
      FSUSBLOG_BACKEND_COVERAGE_LINE_THRESHOLD: '75'
      FSUSBLOG_BACKEND_COVERAGE_BRANCH_THRESHOLD: '55'
      FSUSBLOG_BACKEND_COVERAGE_METHOD_THRESHOLD: '95'
      FSUSBLOG_FRONTEND_COVERAGE_LINE_THRESHOLD: '35'
      FSUSBLOG_FRONTEND_COVERAGE_BRANCH_THRESHOLD: '20'
      FSUSBLOG_FRONTEND_COVERAGE_FUNCTION_THRESHOLD: '30'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-backend
          path: .tmp/coverage/backend-merged
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coverage-frontend
          path: .tmp/coverage/frontend
      - run: ./tools/test.sh coverage-merge --no-deps
      - run: ./tools/test.sh coverage-threshold --no-deps
      - run: ./tools/test.sh coverage-gate --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-merge-threshold
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/coverage/**
            .tmp/release-evidence/jobs/**

  fast-backend:
    name: Fast Backend ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.validate-matrix.outputs.fast_backend_max_parallel) }}
      matrix: ${{ fromJson(needs.validate-matrix.outputs.fast_backend_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - run: ./tools/test.sh ci-tier ${{ matrix.tier }} --no-deps
        env:
          FSUSBLOG_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/master' }}
          FSUSBLOG_CI_JOB_ID: ${{ matrix.artifact_name }}
          FSUSBLOG_DOTNET_BUILD_PARALLELISM: ${{ vars.FSUSBLOG_DOTNET_BUILD_PARALLELISM || 'safe' }}
          FSUSBLOG_TEST_SELECTION: ${{ github.event_name == 'pull_request' && 'affected' || 'full' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/gate-logs/**
            .tmp/backend-auth-state-machine/**
            .tmp/backend-concurrency/**
            .tmp/backend-golden/**
            .tmp/backend-property/**
            .tmp/release-evidence/jobs/**

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-build --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-build
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**
            src/frontend/dist/**

  fast-frontend-unit:
    name: Fast Frontend Unit ${{ matrix.shard_id }}
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.validate-matrix.outputs.fast_frontend_unit_max_parallel) }}
      matrix: ${{ fromJson(needs.validate-matrix.outputs.fast_frontend_unit_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier ${{ matrix.tier }} --no-deps --shard ${{ matrix.shard }}
        env:
          FSUSBLOG_CI_JOB_ID: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src/frontend/coverage/**
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**

  frontend-runtime-contracts:
    name: Frontend Runtime Contracts
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-runtime-contracts --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-runtime-contracts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**

  frontend-static-governance:
    name: Frontend Static Governance
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh ci-tier frontend-static-governance --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-static-governance
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**

  fast-static-governance:
    name: Fast Static Governance
    runs-on: ubuntu-latest
    needs: validate-matrix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - run: node tools/db/migration-doc-lint.mjs
      - run: ./tools/test.sh static-governance --no-deps
      - run: ./tools/test.sh public-hydration-fast --no-deps
      - run: ./tools/test.sh backend-test-governance --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-static-governance
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/gate-logs/**
            .tmp/docs/**
            .tmp/backend-test-governance/**
            .tmp/release-evidence/test-plan.json
            .tmp/release-evidence/doc-sync-summary.json
            .tmp/release-evidence/public-hydration-matrix-summary.json
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/flaky/**

  fast-summary:
    name: Fast Summary
    runs-on: ubuntu-latest
    needs: [fast-backend, frontend-build, fast-frontend-unit, frontend-runtime-contracts, frontend-static-governance, fast-static-governance]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: fast-backend-*
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
          path: .
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: fast-frontend-unit-*
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-runtime-contracts
          path: .
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-static-governance
          path: .
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fast-static-governance
          path: .
      - name: Aggregate fast evidence
        env:
          QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/run-test-matrix.mjs aggregate fast-summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fast-summary
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/gate-logs/**
            .tmp/frontend/**
            .tmp/release-evidence/jobs/**
            src/frontend/coverage/**
            src/frontend/dist/**

  cross-stack-contract:
    name: Cross Stack Contract
    runs-on: ubuntu-latest
    needs: [fast-frontend-unit, fast-static-governance]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh backend-api-integration --no-deps
      - run: ./tools/test.sh cross-stack-contract --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cross-stack-contract
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/backend-api-integration/**
            .tmp/release-evidence/jobs/**
            src/frontend/src/generated/fsusBinaryRoutes.ts
            src/shared/Contracts/Validation/fsusblog.openapi.json
            tests/frontend/fixtures/cross-stack-contract-matrix.generated.json
            tests/frontend/fixtures/cross-stack-contract-matrix.json

  integration-runtime:
    name: Integration Runtime
    runs-on: ubuntu-latest
    needs: [fast-backend, fast-frontend-unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh integration
      - run: ./tools/test.sh data-scale-xs --no-deps
      - run: ./tools/test.sh data-scale-s --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: integration-runtime
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/acceptance/**
            .tmp/scale/**
            .tmp/release-evidence/data-scale-summary.json
            .tmp/release-evidence/jobs/**
            src/frontend/test-results/playwright/integration/**

  endpoint-depth-runtime:
    name: Endpoint Depth Runtime
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 35
    env:
      FSUSBLOG_TEST_NAMESPACE: ci-endpoint-depth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh endpoint-depth --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: endpoint-depth-runtime
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .tmp/contracts/endpoint-depth-matrix.json
            .tmp/release-evidence/endpoint-depth-summary.json
            .tmp/release-evidence/jobs/**

  release-public:
    name: Release Public
    runs-on: ubuntu-latest
    needs: integration-runtime
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
