name: Quality Gate

on:
    pull_request:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

permissions:
    contents: read
    packages: read

concurrency:
    group: quality-gate-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    DOTNET_NOLOGO: "true"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    FSUSBLOG_REPO_ROOT: ${{ github.workspace }}
    FSUSBLOG_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
    FSUSBLOG_CI_STAGE: ${{ github.event_name == 'pull_request' && (vars.FSUSBLOG_CI_STAGE || 'qualification') || 'qualification' }}
    FSUSBLOG_TEST_RUN_ID: quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
    GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}

jobs:
    validate-declarations:
        name: Validate Global Source Declarations
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - run: node tools/run-test-matrix.mjs validate-declarations

    validate-matrix:
        name: Validate Test Matrix
        runs-on: ubuntu-latest
        needs: [validate-declarations, plan-pr-risk, behavior-doc-static-admission]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.validate_matrix == 'true'
        timeout-minutes: 20
        outputs:
            backend_qps_collectors_matrix: ${{ steps.backend_qps_collectors_matrix.outputs.matrix }}
            backend_qps_collectors_max_parallel: ${{ steps.backend_qps_collectors_matrix.outputs.max_parallel }}
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - run: npm --prefix tests/tools ci --ignore-scripts --no-audit --progress=false
            - run: ./tools/test.sh ci-tier validate-matrix --no-deps
            - run: node tools/test/check-physical-execution-consumer-evidence.mjs .tmp/physical-execution-projections/validate-matrix-matrix-governance.json
            - run: node tools/run-test-matrix.mjs ci-plan --format github-actions --out .tmp/ci-plan.json
            - run: node tools/check-workflow-matrix-sync.mjs .tmp/ci-plan.json .github/workflows/quality-gate.yml
            - id: backend_qps_collectors_matrix
              run: node tools/run-test-matrix.mjs ci-job-matrix backend-qps-collectors --github-output "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: validate-matrix
                  if-no-files-found: ignore
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      .tmp/ci-plan.json
                      .tmp/gate-logs/preflight.json
                      .tmp/physical-execution-projections/validate-matrix-matrix-governance.json
                      .tmp/physical-executions/**
                      .tmp/release-evidence/jobs/**
                      .tmp/release-evidence/test-plan.json
                      .tmp/release-evidence/test-inventory.json
                      .tmp/docs/browser-contract-matrix.json
                      .tmp/docs/fast-backend-matrix.json
                      .tmp/docs/fast-frontend-unit-matrix.json
                      .tmp/docs/generated-testing-docs.json
                      docs/testing.generated.md

    behavior-doc-static-admission:
        name: BehaviorDoc Static Admission
        runs-on: ubuntu-latest
        needs: [validate-declarations, plan-pr-risk]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.behavior_doc_static_admission == 'true'
        timeout-minutes: 20
        outputs:
            receipt_digest: ${{ steps.receipt.outputs.receipt_digest }}
            source_commit: ${{ steps.receipt.outputs.source_commit }}
            source_fingerprint: ${{ steps.receipt.outputs.source_fingerprint }}
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
            FSUSBLOG_BEHAVIOR_DOC_NUGET_PREPARATION: .tmp/behavior-doc-nuget-preparation/quality-gate-${{ github.run_id }}-${{ github.run_attempt }}.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - id: behavior_feed
              name: Acquire locked BehaviorDoc feed
              run: node tools/docs/acquire-behavior-doc-feed.mjs
            - name: Prepare offline BehaviorDoc dependencies
              env:
                  FEED_ROOT: ${{ steps.behavior_feed.outputs.feed_root }}
                  FEED_DIGEST: ${{ steps.behavior_feed.outputs.feed_digest }}
              run: node tools/docs/prepare-behavior-doc-nuget.mjs --run-id "$FSUSBLOG_TEST_RUN_ID" --out "$FSUSBLOG_BEHAVIOR_DOC_NUGET_PREPARATION" --feed-root "$FEED_ROOT" --feed-digest "$FEED_DIGEST"
            - run: ./tools/test.sh ci-tier behavior-doc-static-admission --no-deps
            - id: receipt
              name: Export sealed admission identity
              run: |
                  node --input-type=module -e '
                    import fs from "node:fs";
                    const receipt = JSON.parse(fs.readFileSync(".tmp/behavior-doc-static-admission/receipt.json", "utf8"));
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, `receipt_digest=${receipt.contentDigest}\nsource_commit=${receipt.source.commit}\nsource_fingerprint=${receipt.source.worktreeFingerprint}\n`);
                  '
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: behavior-doc-static-admission
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      .tmp/behavior-doc-static-admission/**
                      .tmp/behavior-doc-feed-acquisition/**/acquisition.json
                      .tmp/behavior-doc-nuget-preparation/*.json

    test-inventory:
        name: Compiled Test Inventory
        runs-on: ubuntu-latest
        needs: [validate-matrix, behavior-doc-static-admission, plan-pr-risk]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.test_inventory == 'true'
        timeout-minutes: 20
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - run: ./tools/test.sh ci-tier test-inventory --no-deps
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: test-inventory
                  path: .tmp/release-evidence/test-inventory.json
                  include-hidden-files: true
                  if-no-files-found: error

    plan-pr-risk:
        name: Plan PR Smart Gate
        runs-on: ubuntu-latest
        needs: [validate-declarations]
        timeout-minutes: 5
        outputs:
            coverage_summary: ${{ steps.smart.outputs.coverage_summary }}
            test_inventory: ${{ steps.smart.outputs.test_inventory }}
            release_evidence: ${{ steps.smart.outputs.release_evidence }}
            fast_summary: ${{ steps.smart.outputs.fast_summary }}
            fast_static_governance: ${{ steps.smart.outputs.fast_static_governance }}
            frontend_runtime_contracts: ${{ steps.smart.outputs.frontend_runtime_contracts }}
            frontend_static_governance: ${{ steps.smart.outputs.frontend_static_governance }}
            fast_frontend_unit: ${{ steps.smart.outputs.fast_frontend_unit }}
            frontend_build: ${{ steps.smart.outputs.frontend_build }}
            fast_backend: ${{ steps.smart.outputs.fast_backend }}
            wasm_build_artifacts: ${{ steps.smart.outputs.wasm_build_artifacts }}
            behavior_evidence_pre_runtime: ${{ steps.smart.outputs.behavior_evidence_pre_runtime }}
            backend_mutation: ${{ steps.smart.outputs.backend_mutation }}
            behavior_test_evidence: ${{ steps.smart.outputs.behavior_test_evidence }}
            behavior_doc_static_admission: ${{ steps.smart.outputs.behavior_doc_static_admission }}
            source_governance: ${{ steps.smart.outputs.source_governance }}
            validate_matrix: ${{ steps.smart.outputs.validate_matrix }}
            pr_smart_gate_summary: ${{ steps.smart.outputs.pr_smart_gate_summary }}
            plan_content_digest: ${{ steps.smart.outputs.plan_content_digest }}
            plan_source_commit: ${{ steps.smart.outputs.plan_source_commit }}
            plan_source_fingerprint: ${{ steps.smart.outputs.plan_source_fingerprint }}
            plan_run_id: ${{ steps.smart.outputs.plan_run_id }}
            plan_run_attempt: ${{ steps.smart.outputs.plan_run_attempt }}
            coverage_backend: ${{ steps.smart.outputs.coverage_backend }}
            coverage_frontend: ${{ steps.smart.outputs.coverage_frontend }}
            coverage_merge_threshold: ${{ steps.smart.outputs.coverage_merge_threshold }}
            integration_runtime: ${{ steps.smart.outputs.integration_runtime }}
            endpoint_depth_runtime: ${{ steps.smart.outputs.endpoint_depth_runtime }}
            cross_stack_contract: ${{ steps.smart.outputs.cross_stack_contract }}
            release_public: ${{ steps.smart.outputs.release_public }}
            security_runtime: ${{ steps.smart.outputs.security_runtime }}
            security_static_fuzz: ${{ steps.smart.outputs.security_static_fuzz }}
            browser_contract: ${{ steps.smart.outputs.browser_contract }}
            resilience_runtime: ${{ steps.smart.outputs.resilience_runtime }}
            load_smoke: ${{ steps.smart.outputs.load_smoke }}
            backend_qps_collectors: ${{ steps.smart.outputs.backend_qps_collectors }}
            backend_qps_collectors_matrix: ${{ steps.smart.outputs.backend_qps_collectors_matrix }}
            backend_qps_collectors_max_parallel: ${{ steps.smart.outputs.backend_qps_collectors_max_parallel }}
            backend_qps: ${{ steps.smart.outputs.backend_qps }}
            perf_regression: ${{ steps.smart.outputs.perf_regression }}
            production_build_artifacts: ${{ steps.smart.outputs.production_build_artifacts }}
            production_build_domains: ${{ steps.smart.outputs.production_build_domains }}
            production_build_domains_json: ${{ steps.smart.outputs.production_build_domains_json }}
            production_summary: ${{ steps.smart.outputs.production_summary }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - name: Generate source-bound PR plan
              id: smart
              env:
                  FSUSBLOG_PR_EVENT_NAME: ${{ github.event_name }}
                  FSUSBLOG_PR_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
              run: >-
                  node tools/run-test-matrix.mjs ci-pr-plan
                  --event-name "$FSUSBLOG_PR_EVENT_NAME" --base-ref "$FSUSBLOG_PR_BASE_REF"
                  --out .tmp/pr-plan.json --github-output "$GITHUB_OUTPUT"
            - name: Upload source-bound PR smart gate plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: .tmp/pr-plan.json
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: pr-smart-gate
                  if-no-files-found: ignore
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      .tmp/pr-plan.json
                      .tmp/pr-changed-files.txt
                      .tmp/release-evidence/pr-smart-gate-summary.json

    source-governance:
        name: Applicable Source Governance
        runs-on: ubuntu-latest
        needs: [validate-declarations, plan-pr-risk]
        if: needs.plan-pr-risk.outputs.source_governance == 'true'
        timeout-minutes: 15
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - run: npm --prefix tools/frontend/style-toolchain ci --ignore-scripts --no-audit --progress=false
            - run: npm --prefix tools/style/markdownlint-toolchain ci --ignore-scripts --no-audit --progress=false
            - run: echo "$GITHUB_WORKSPACE/tools/style/markdownlint-toolchain/node_modules/.bin" >> "$GITHUB_PATH"
            - run: npm --prefix tools/governance/javascript-format-parser ci --ignore-scripts --no-audit --progress=false
            - run: node tools/test-matrix/source-governance.mjs
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: source-governance
                  path: .tmp/source-governance/result.json
                  if-no-files-found: error


    behavior-test-evidence:
        name: Behavior Test Evidence
        runs-on: ubuntu-latest
        needs: [validate-matrix, behavior-doc-static-admission, plan-pr-risk]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.behavior_test_evidence == 'true'
        timeout-minutes: 30
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: validate-matrix
                  path: .
            - run: ./tools/test.sh ci-tier behavior-test-evidence --no-deps
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: behavior-test-evidence
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: .tmp/behavior-test-evidence/**

    backend-mutation:
        name: Changed Critical Behavior Mutation
        runs-on: ubuntu-latest
        needs: [behavior-doc-static-admission, behavior-test-evidence, plan-pr-risk]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.backend_mutation == 'true'
        timeout-minutes: 120
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: behavior-test-evidence
                  path: .tmp/behavior-test-evidence
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: pr-smart-gate
                  path: .tmp
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: validate-matrix
                  path: .
            - name: Run per-behavior mutation qualification
              env:
                  FSUSBLOG_MUTATION_SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
              run: ./tools/test.sh ci-tier backend-mutation-changed-critical --no-deps
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: backend-mutation
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: .tmp/mutation/**

    behavior-evidence-pre-runtime:
        name: Behavior Evidence Pre-Runtime
        runs-on: ubuntu-latest
        needs: [backend-mutation, behavior-doc-static-admission, behavior-test-evidence, plan-pr-risk]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.behavior_evidence_pre_runtime == 'true'
        timeout-minutes: 10
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: behavior-test-evidence
                  path: .tmp/behavior-test-evidence
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: backend-mutation
                  path: .tmp/mutation
            - run: ./tools/test.sh ci-tier behavior-evidence-pre-runtime --no-deps
