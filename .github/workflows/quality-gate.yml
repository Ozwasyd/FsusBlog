      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-render-pressure
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/frontend/dom-budget.json
            .tmp/frontend/dom-budget/**
            .tmp/frontend/route-render-pressure.json
            .tmp/frontend/markdown-render-budget.json
            .tmp/frontend/dom-depth-static.json
            .tmp/release-evidence/frontend-render-pressure-summary.json
            .tmp/release-evidence/jobs/**
            src/frontend/test-results/playwright/**

  cross-browser-smoke:
    name: Cross Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, production-build-artifacts, release-public]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.cross_browser_smoke == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      FSUSBLOG_PLAYWRIGHT_WORKERS: '1'
      FSUSBLOG_PLAYWRIGHT_BROWSERS: ${{ matrix.browser }}
      FSUSBLOG_TEST_NAMESPACE: ci-cross-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend exec -- playwright install --with-deps ${{ matrix.browser }}
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: cross-browser-${{ matrix.browser }}
      - run: ./tools/test.sh bootstrap --no-deps
      - run: node tools/ci/run-flaky-governed.mjs --suite cross-browser-smoke --test ${{ matrix.browser }} -- ./tools/test.sh cross-browser-smoke --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cross-browser-smoke-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            src/frontend/test-results/playwright/cross-browser/**
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/flaky/**

  resilience-runtime:
    name: Resilience Runtime
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, production-build-artifacts, integration-runtime]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.resilience_runtime == 'true'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: resilience-runtime
      - run: ./tools/test.sh resilience
      - run: ./tools/test.sh fault-injection --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: resilience-runtime
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/fault-injection/**
            .tmp/runtime/resilience.json
            .tmp/release-evidence/aot-cache-resilience-summary.json
            .tmp/release-evidence/jobs/**

  load-smoke:
    name: Load Smoke
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, production-build-artifacts, integration-runtime]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.load_smoke == 'true'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: load-smoke
      - run: ./tools/test.sh load
      - run: ./tools/test.sh load-baseline --no-deps
      - run: ./tools/test.sh load-peak --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: load-smoke
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/perf/**
            .tmp/release-evidence/jobs/**

  backend-qps-collectors:
    name: Backend QPS Collector ${{ matrix.shard_id }}
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, production-build-artifacts]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.backend_qps_collectors == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan-pr-risk.outputs.backend_qps_collectors_max_parallel) }}
      matrix: ${{ fromJson(needs.plan-pr-risk.outputs.backend_qps_collectors_matrix) }}
    env:
      FSUSBLOG_TEST_NAMESPACE: ci-backend-qps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: backend-qps-${{ matrix.tier }}
      - run: ./tools/test.sh bootstrap --no-deps
      - run: ./tools/test.sh ci-tier ${{ matrix.tier }} --no-deps
        env:
          FSUSBLOG_CI_JOB_ID: ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/perf/backend-qps/**
            .tmp/release-evidence/jobs/**

  backend-qps:
    name: Backend QPS Aggregate
    runs-on: ubuntu-latest
    needs: [plan-pr-risk, integration-runtime, backend-qps-collectors]
    if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.backend_qps == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: backend-qps-collectors-*
          path: .tmp
          merge-multiple: true
      - run: ./tools/test.sh ci-tier backend-qps --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-qps
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/perf/backend-qps/**
            .tmp/release-evidence/backend-qps-summary.json
            .tmp/release-evidence/backend-qps-runtime-sequential-summary.json
            .tmp/release-evidence/jobs/**

  perf-regression:
    name: Perf Regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [validate-matrix, production-build-artifacts, frontend-build]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}
      - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend exec -- playwright install --with-deps ${{ matrix.browser }}
      - uses: ./.github/actions/consume-production-build
        with:
          source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
          receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
          consumer-job: perf-${{ matrix.browser }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
          path: .
      - name: AEDS frame and browser boundary
        if: matrix.browser == 'chromium'
        env:
          FSUSBLOG_AEDS_BROWSERS: chromium
        run: node tools/ci/run-flaky-governed.mjs --suite perf-regression --test aeds-frame-cost-${{ matrix.browser }} -- ./tools/test.sh aeds-frame-cost --no-deps
      - name: AEDS browser boundary
        if: matrix.browser != 'chromium'
        env:
          FSUSBLOG_AEDS_BROWSERS: ${{ matrix.browser }}
        run: node tools/ci/run-flaky-governed.mjs --suite perf-regression --test aeds-frame-cost-${{ matrix.browser }} -- node tests/frontend/checks/wasm/check-aeds-tier-browser.mjs
      - if: matrix.browser == 'chromium'
        run: ./tools/test.sh aeds-compression-profile --no-deps
      - if: matrix.browser == 'chromium'
        run: ./tools/test.sh backend-perf --no-deps
      - if: matrix.browser == 'chromium'
        run: ./tools/test.sh backend-benchmark-regression --no-deps
      - if: matrix.browser == 'chromium'
        run: ./tools/test.sh browser-performance-regression --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-regression-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/backend-perf/**
            .tmp/perf/aeds-frame-cost/**
            .tmp/perf/aeds-compression-profile/**
            .tmp/perf/public-hot-read-residency-profile/summary.json
            .tmp/perf/browser-performance.json
            .tmp/perf/release-summaries/backend-benchmark-regression.json
            .tmp/perf/release-summaries/browser-performance-regression.json
            .tmp/frontend/aeds-decode-budget/summary.json
            .tmp/frontend/aeds-wasm-browser/summary.json
            .tmp/release-evidence/aeds-frame-cost-summary.json
            .tmp/release-evidence/aeds-compression-profile-summary.json
            .tmp/release-evidence/aeds-decode-budget-summary.json
            .tmp/release-evidence/aeds-wasm-browser-summary.json
            .tmp/release-evidence/public-hot-read-residency-profile.json
            .tmp/release-evidence/jobs/**
            .tmp/release-evidence/flaky/**
            BenchmarkDotNet.Artifacts/results/**

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    needs:
      - coverage-merge-threshold
      - fast-backend
      - frontend-build
      - fast-frontend-unit
      - frontend-runtime-contracts
      - frontend-static-governance
      - fast-static-governance
      - fast-summary
      - cross-stack-contract
      - endpoint-depth-runtime
      - integration-runtime
      - release-public
      - security-runtime
      - security-static-fuzz
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - backend-qps
      - perf-regression
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: .tmp/downloaded-artifacts
      - run: ./tools/test.sh data-scale-evidence-summary --no-deps
      - run: ./tools/test.sh performance-evidence-summary --no-deps
      - run: ./tools/test.sh release-evidence --no-deps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence
          if-no-files-found: ignore
          retention-days: 30
          include-hidden-files: true
          path: |
            .tmp/release-evidence/**
            .tmp/perf/release-summaries/performance-saturation-v2.json

  production-summary:
    name: Production Summary
    runs-on: ubuntu-latest
    needs:
      - plan-pr-risk
      - validate-matrix
      - production-build-artifacts
      - coverage-merge-threshold
      - fast-backend
      - frontend-build
      - fast-frontend-unit
      - frontend-runtime-contracts
      - frontend-static-governance
      - fast-static-governance
      - fast-summary
      - cross-stack-contract
      - endpoint-depth-runtime
      - integration-runtime
      - release-public
      - security-runtime
      - security-static-fuzz
      - acceptance-playwright
      - visual-playwright
      - ux-viewport-smoke
      - frontend-render-pressure
      - cross-browser-smoke
      - resilience-runtime
      - load-smoke
      - backend-qps
      - perf-regression
      - release-evidence
    if: always() && (github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_summary == 'true')
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: .tmp/downloaded-artifacts
      - name: Check required job results
        env:
          QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/ci/summarize-quality-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-summary
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: .tmp/release-evidence/jobs/**
