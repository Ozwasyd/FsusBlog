    production-build-artifacts:
        name: Immutable Production Build Artifacts
        runs-on: ubuntu-latest
        needs: [validate-matrix, behavior-doc-static-admission, plan-pr-risk, wasm-build-artifacts]
        if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_build_artifacts == 'true'
        timeout-minutes: 35
        outputs:
            source_fingerprint: ${{ steps.receipt.outputs.source_fingerprint }}
            receipt_digest: ${{ steps.receipt.outputs.receipt_digest }}
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
            FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/pr-plan.json
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: wasm-build-artifacts
                  path: src/frontend/public/wasm
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
            - run: ./tools/test.sh ci-tier production-build-artifacts --no-deps
              env:
                  FSUSBLOG_CI_PRODUCTION_BUILD_DOMAINS: ${{ needs.plan-pr-risk.outputs.production_build_domains }}
            - id: receipt
              name: Export immutable receipt identity
              run: |
                  # Node source is intentionally single-quoted for the shell.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                    import fs from "node:fs";
                    const receipt = JSON.parse(fs.readFileSync(".tmp/ci-production-build/receipt.json", "utf8"));
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_fingerprint=${receipt.sourceState.worktreeFingerprint}\nreceipt_digest=${receipt.contentDigest}\n`);
                  '
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: production-build-artifacts
                  if-no-files-found: error
                  retention-days: 3
                  compression-level: 6
                  include-hidden-files: true
                  path: |
                      .tmp/ci-production-build/**

