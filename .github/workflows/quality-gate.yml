            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
                  cache: npm
                  cache-dependency-path: src/frontend/package-lock.json
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - run: node tools/ci/run-stage.mjs --stage install -- npm --prefix src/frontend ci --no-audit --progress=false
            - uses: ./.github/actions/consume-production-build
              with:
                  source-fingerprint: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
                  consumer-job: perf-regression
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: frontend-build
                  path: .
            - name: AEDS frame and browserless decode budget
              run: ./tools/test.sh aeds-frame-cost --no-deps
            - run: ./tools/test.sh aeds-compression-profile --no-deps
            - run: ./tools/test.sh backend-perf --no-deps
            - run: ./tools/test.sh backend-benchmark-regression --no-deps
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: perf-regression
                  if-no-files-found: ignore
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      .tmp/backend-perf/**
                      .tmp/perf/aeds-frame-cost/**
                      .tmp/perf/aeds-compression-profile/**
                      .tmp/perf/public-hot-read-residency-profile/summary.json
                      .tmp/perf/public-hot-read-residency-profile/measurement-noise.json
                      .tmp/perf/release-summaries/backend-benchmark-regression.json
                      .tmp/perf/release-summaries/backend-benchmark-regression.measurement-noise.json
                      .tmp/frontend/aeds-decode-budget/summary.json
                      .tmp/frontend/aeds-decode-budget/measurement-noise.json
                      .tmp/release-evidence/aeds-frame-cost-summary.json
                      .tmp/release-evidence/aeds-compression-profile-summary.json
                      .tmp/release-evidence/aeds-decode-budget-summary.json
                      .tmp/release-evidence/public-hot-read-residency-profile.json
                      .tmp/release-evidence/jobs/**
                      BenchmarkDotNet.Artifacts/results/**

    release-evidence:
        name: Release Evidence
        runs-on: ubuntu-latest
        outputs:
            evidence_transport_manifest_digest: ${{ steps.evidence_transport.outputs.manifest_digest }}
        needs: [validate-matrix, plan-pr-risk, behavior-doc-static-admission, behavior-evidence-pre-runtime, production-build-artifacts, coverage-summary, fast-backend, frontend-build, fast-frontend-unit, frontend-runtime-contracts, frontend-static-governance, fast-static-governance, fast-summary, cross-stack-contract, endpoint-depth-runtime, integration-runtime, release-public, security-runtime, security-static-fuzz, resilience-runtime, load-smoke, backend-qps, perf-regression]
        if: always() && needs.behavior-doc-static-admission.result == 'success' && (github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.release_evidence == 'true')
        timeout-minutes: 10
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - run: npm --prefix tools/test-matrix/schema-validator ci --ignore-scripts --no-audit --progress=false
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  path: .tmp/downloaded-artifacts
            - name: Download source-bound PR smart gate plan
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp/quality-gate-plan
            - name: Download current integration scale producer
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: integration-runtime
                  path: .tmp/downloaded-artifacts/integration-runtime
            - run: ./tools/test.sh data-scale-evidence-summary --no-deps
              env:
                  FSUSBLOG_DATA_SCALE_PRODUCER_JOB: integration-runtime
            - run: ./tools/test.sh performance-evidence-summary --no-deps
            - run: ./tools/test.sh release-evidence --no-deps
              env:
                  FSUSBLOG_DOWNLOADED_ARTIFACTS_ROOT: .tmp/release-evidence-empty-input
            - name: Upload exact release-evidence manifest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: quality-gate-release-evidence-manifest
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: .tmp/release-evidence/manifest.json
            - name: Seal quality-gate evidence transport
              id: evidence_transport
              if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_summary == 'true'
              env:
                  FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/quality-gate-plan/pr-plan.json
                  FSUSBLOG_CI_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
                  FSUSBLOG_CI_PRODUCTION_SOURCE_FINGERPRINT: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  FSUSBLOG_CI_PRODUCTION_RECEIPT_DIGEST: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
                  FSUSBLOG_QUALITY_GATE_ARTIFACT_DOWNLOAD_ROOT: .tmp/downloaded-artifacts
                  FSUSBLOG_RELEASE_EVIDENCE_DIR: .tmp/release-evidence
                  QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
              run: node tools/ci/prepare-quality-gate-evidence-transport.mjs
            - name: Upload sealed quality-gate evidence transport
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_summary == 'true'
              with:
                  name: quality-gate-evidence-transport
                  if-no-files-found: error
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      artifacts/current-run/transport-manifest.json
                      artifacts/current-run/transport-archive.json
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: release-evidence
                  if-no-files-found: ignore
                  retention-days: 30
                  include-hidden-files: true
                  path: |
                      .tmp/release-evidence/**
                      .tmp/physical-execution-projections/release-evidence-plan-matrix-governance.json
                      .tmp/test-results/live-grant/**
                      .tmp/test-results/release-domain-assertions/release-evidence/**
                      .tmp/test-results/evidence-producers/release-evidence/**
                      .tmp/perf/release-summaries/performance-saturation-v2.json

    production-summary:
        name: Production Summary
        runs-on: ubuntu-latest
        outputs:
            evidence_transport_manifest_digest: ${{ steps.verify_evidence_transport.outputs.manifest_digest }}
        needs: [behavior-doc-static-admission, behavior-evidence-pre-runtime, plan-pr-risk, validate-matrix, production-build-artifacts, coverage-summary, fast-backend, frontend-build, fast-frontend-unit, frontend-runtime-contracts, frontend-static-governance, fast-static-governance, fast-summary, cross-stack-contract, endpoint-depth-runtime, integration-runtime, release-public, security-runtime, security-static-fuzz, resilience-runtime, load-smoke, backend-qps, perf-regression, release-evidence]
        if: always() && needs.behavior-doc-static-admission.result == 'success' && needs.behavior-evidence-pre-runtime.result == 'success' && (github.event_name != 'pull_request' || needs.plan-pr-risk.outputs.production_summary == 'true')
        timeout-minutes: 120
        env:
            FSUSBLOG_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24.16.0
            - uses: ./.github/actions/consume-behavior-doc-admission
              with:
                  source-fingerprint: ${{ needs.behavior-doc-static-admission.outputs.source_fingerprint }}
                  receipt-digest: ${{ needs.behavior-doc-static-admission.outputs.receipt_digest }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: behavior-evidence-pre-runtime
                  path: .tmp
            - name: Verify pre-runtime behavior evidence
              run: >-
                  node tools/test-matrix/behavior-evidence-pre-runtime.mjs
                  --guard-runtime-candidate .tmp/behavior-evidence-pre-runtime/receipt.json
                  --source-commit "$FSUSBLOG_TEST_SOURCE_COMMIT"
                  --worktree-fingerprint "$FSUSBLOG_TEST_SOURCE_FINGERPRINT"
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  path: .tmp/downloaded-artifacts
            - name: Download source-bound PR smart gate plan
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-pr-smart-gate-plan
                  path: .tmp/quality-gate-plan
            - name: Download release-evidence manifest
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-release-evidence-manifest
                  path: .tmp/quality-gate-release-evidence
            - name: Download sealed quality-gate evidence transport
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: quality-gate-evidence-transport
                  path: artifacts/current-run
            - name: Verify and extract sealed quality-gate evidence transport
              run: >-
                  node tools/test/run-current-run-evidence-transport.mjs extract
                  --manifest artifacts/current-run/transport-manifest.json
                  --expected-manifest-digest "${{ needs.release-evidence.outputs.evidence_transport_manifest_digest }}"
                  --expected-authority evidence-consumer.ci.check-job-summaries.current-run
                  --expected-authority evidence-consumer.ci.check-flaky-evidence.current-run
                  --extract-root .
            - name: Bind transported evidence to the live production summary
              id: verify_evidence_transport
              env:
                  FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/quality-gate-plan/pr-plan.json
                  FSUSBLOG_CI_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
                  FSUSBLOG_CI_PRODUCTION_SOURCE_FINGERPRINT: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  FSUSBLOG_CI_PRODUCTION_RECEIPT_DIGEST: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
                  FSUSBLOG_QUALITY_GATE_ARTIFACT_DOWNLOAD_ROOT: .tmp/downloaded-artifacts
                  FSUSBLOG_EVIDENCE_TRANSPORT_MANIFEST: artifacts/current-run/transport-manifest.json
                  FSUSBLOG_EVIDENCE_TRANSPORT_MANIFEST_DIGEST: ${{ needs.release-evidence.outputs.evidence_transport_manifest_digest }}
              run: node tools/ci/verify-quality-gate-evidence-transport.mjs
            - name: Check required job results
              env:
                  QUALITY_GATE_NEEDS_JSON: ${{ toJson(needs) }}
                  FSUSBLOG_CI_PR_SMART_GATE_PLAN: .tmp/quality-gate-plan/pr-plan.json
                  FSUSBLOG_CI_PR_PLAN_DIGEST: ${{ needs.plan-pr-risk.outputs.plan_content_digest }}
                  FSUSBLOG_CI_PRODUCTION_SOURCE_FINGERPRINT: ${{ needs.production-build-artifacts.outputs.source_fingerprint }}
                  FSUSBLOG_CI_PRODUCTION_RECEIPT_DIGEST: ${{ needs.production-build-artifacts.outputs.receipt_digest }}
                  FSUSBLOG_QUALITY_GATE_ARTIFACT_DOWNLOAD_ROOT: .tmp/downloaded-artifacts
                  FSUSBLOG_EVIDENCE_TRANSPORT_MANIFEST: artifacts/current-run/transport-manifest.json
                  FSUSBLOG_EVIDENCE_TRANSPORT_MANIFEST_DIGEST: ${{ needs.release-evidence.outputs.evidence_transport_manifest_digest }}
                  FSUSBLOG_RELEASE_EVIDENCE_DIR: .tmp/quality-gate-release-evidence
                  FSUSBLOG_RELEASE_EVIDENCE_MANIFEST: .tmp/quality-gate-release-evidence/manifest.json
              run: node tools/ci/summarize-quality-gate.mjs
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              if: always()
              with:
                  name: production-summary
                  if-no-files-found: ignore
                  retention-days: 14
                  include-hidden-files: true
                  path: |
                      .tmp/release-evidence/jobs/**
                      .tmp/release-evidence/browserless-correctness-receipt.json
