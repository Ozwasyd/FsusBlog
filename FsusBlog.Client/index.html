<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>
      (() => {
        const storageKey = 'fsus:theme-mode';
        const validModes = new Set(['light', 'dark', 'system']);
        const root = document.documentElement;
        let mode = 'system';

        try {
          const stored = window.localStorage.getItem(storageKey);
          if (stored && validModes.has(stored)) {
            mode = stored;
          }
        } catch {
        }

        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        root.classList.toggle('dark', resolvedTheme === 'dark');
        root.dataset.theme = resolvedTheme;
        root.dataset.themeMode = mode;
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/api/Article/rss" />
    <link rel="stylesheet" href="/src/assets/public-shell-critical.css" data-fsus-style="public-shell-critical" />
    <link rel="stylesheet" href="/src/assets/public-page.css" data-fsus-style="public-page" />
    <title>Loading...</title>
    
    <style>
      /* Inline baseline for AOT first paint when external CSS is delayed. */
      html,
      body {
        background: #ffffff;
        color: #09090b;
      }

      html.dark,
      html.dark body {
        background: #09090b;
        color: #f4f4f5;
      }

      #fsus-aot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        width: 100%;
        background: #ffffff;
        color: #09090b;
        font-family: "Google Sans", "Noto Sans SC", "Noto Sans TC", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: subpixel-antialiased;
        text-rendering: optimizeLegibility;
      }

      #fsus-aot-shell,
      #fsus-aot-shell * {
        box-sizing: border-box;
      }

      /* 公开页 AOT 首屏契约：即使外链样式延迟/失效，也保持基础可读布局 */
      #fsus-aot-shell a {
        color: #27272a;
        text-decoration: none;
      }

      html.dark #fsus-aot-shell {
        background: #09090b;
        color: #f4f4f5;
      }

      html.dark #fsus-aot-shell a {
        color: #d4d4d8;
      }

      #fsus-aot-shell .mono-link,
      #fsus-aot-shell .active-link {
        font-size: 0.875rem;
      }

      #fsus-aot-shell .active-link {
        color: #09090b;
        font-weight: 700;
      }

      html.dark #fsus-aot-shell .active-link {
        color: #fafafa;
      }

      #fsus-aot-shell .ui-article-card {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      #fsus-aot-shell .ui-article-title {
        font-size: 1.35rem;
        line-height: 1.3;
        font-weight: 700;
        color: #09090b;
      }

      #fsus-aot-shell .ui-article-summary {
        font-size: 0.96rem;
        line-height: 1.75;
        color: #52525b;
      }

      html.dark #fsus-aot-shell .ui-article-title {
        color: #fafafa;
      }

      html.dark #fsus-aot-shell .ui-article-summary {
        color: #a1a1aa;
      }

      #fsus-aot-shell .ui-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #f4f4f5;
      }

      html.dark #fsus-aot-shell .ui-pagination {
        border-top-color: #27272a;
      }

      #global-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #ffffff; /* 纯白背景 */
        display: flex;
        align-items: center;
        justify-content: center;
        /* 为 App.vue 中的透明度变化提供平滑过渡 */
        transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
      }

      html.dark #global-loader {
        background-color: #09090b;
      }

      #global-loader[hidden] {
        display: none;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      /* 等宽、极细、宽字距的灰色文字 */
      .loader-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #a1a1aa; /* 对应 Tailwind 的 zinc-400 */
        text-transform: uppercase;
        animation: pulse-text 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      html.dark .loader-text {
        color: #a1a1aa;
      }

      /* 进度条轨道：极浅的灰色 */
      .loader-bar-container {
        width: 64px;
        height: 1px;
        background-color: #f4f4f5; /* 对应 zinc-100 */
        overflow: hidden;
        position: relative;
      }

      html.dark .loader-bar-container {
        background-color: #27272a;
      }

      /* 进度条滑块：极具重量感的纯黑 */
      .loader-bar {
        position: absolute;
        inset: 0;
        background-color: #09090b; /* 对应 zinc-950 */
        animation: slide-bar 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      html.dark .loader-bar {
        background-color: #fafafa;
      }

      @keyframes pulse-text {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @keyframes slide-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    
    <div id="global-loader" hidden aria-hidden="true">
      <div class="loader-content">
        <span class="loader-text">Initializing</span>
        <div class="loader-bar-container">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/bootstrap/entry.ts"></script>
  </body>
</html>
