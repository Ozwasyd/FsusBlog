# 修复日期: 2026-02-21
# 修正说明：禁止对不存在的 .map 文件返回 index.html，彻底解决前端控制台 JSON 解析报错。
# 逻辑自洽：在非 root 环境下由 Docker 具名卷托管静态资源。

server {
    # 核心修复：对齐外部 OpenResty 的 $upstream_ui 目标端口
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 支持 Vue History 模式
        try_files $uri $uri/ /index.html;
    }

    # 核心修复(2026-02-21)：拦截所有 .map 请求，直接返回 404
    # 逻辑自洽：防止浏览器将 404 响应(index.html)误认为源码映射而导致 JSON.parse 报错
    location ~* \.map$ {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 性能最大化：开启静态文件高效传输机制
    sendfile on;
    tcp_nopush on;

    # 简单的错误拦截与容错降级
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}