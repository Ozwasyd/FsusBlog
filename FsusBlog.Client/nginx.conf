server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 逻辑自洽的关键：支持 Vue History 模式
        try_files $uri $uri/ /index.html;
    }

    # 开启静态文件高效传输
    sendfile on;
    tcp_nopush on;

    # 简单的错误拦截
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}