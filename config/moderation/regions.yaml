region_groups:
  - group_code: GLOBAL
    display_name: Global
    policy_template: global-baseline
    builtin: true
    enabled: true
    regions: [GLOBAL, UNKNOWN]
    description: Global baseline group.
  - group_code: GREATER_CHINA
    display_name: Greater China
    policy_template:
    builtin: true
    enabled: true
    regions: [CN-MAINLAND, CN-HK, CN-MO, CN-TW]
    description: Grouping only; does not propagate CN-MAINLAND strict policy.
  - group_code: EU
    display_name: European Union
    policy_template: eu-illegal-content-baseline
    builtin: true
    enabled: true
    regions: [EU, EU-DE, EU-FR, EU-NL]
    description: EU illegal content baseline group.
  - group_code: EUROPE_NON_EU
    display_name: Europe Non-EU
    policy_template:
    builtin: true
    enabled: true
    regions: [UK]
    description: Non-EU Europe grouping.
  - group_code: NORTH_AMERICA
    display_name: North America
    policy_template:
    builtin: true
    enabled: true
    regions: [US, US-CA, US-TX, CA]
    description: North America grouping.
  - group_code: APAC
    display_name: APAC
    policy_template:
    builtin: true
    enabled: true
    regions: [JP, KR, SG, AU, NZ]
    description: APAC grouping.
  - group_code: SEA
    display_name: Southeast Asia
    policy_template:
    builtin: true
    enabled: true
    regions: [SG]
    description: Southeast Asia grouping.
  - group_code: COMMONWEALTH
    display_name: Commonwealth
    policy_template:
    builtin: true
    enabled: true
    regions: [UK, AU, NZ, CA]
    description: Commonwealth grouping.
  - group_code: CUSTOM
    display_name: Custom
    policy_template:
    builtin: true
    enabled: true
    regions: []
    description: Operator-defined regions and groups attach here by default.
