worker_processes auto;

# 历史兼容链路：该本地 nginx 代理仅服务特殊本地代理场景。
# 它不是仓库标准的开发/测试端口协议入口；默认协议固定为 3000/5000/8080。

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Production gateway baseline:
    # - Terminate TLS and HTTP/2 at the host OpenResty/Nginx layer.
    # - Proxy to Kestrel on 127.0.0.1:8080 or the Docker bridge address.
    # - Keep SSE buffering disabled for /api/notifications/stream.
    # - Keep upload limits explicit and aligned with FileService limits.
    # - Let Kestrel serve hashed assets with immutable Cache-Control.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 32m;

    upstream fsusblog_release {
        server fsus-kestrel-final-upstream:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /__nginx_health {
            default_type text/plain;
            return 200 "fsusblog local nginx proxy ok\n";
        }

        location = /health/live {
            proxy_pass http://fsusblog_release/health/live;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        location = /health/ready {
            proxy_pass http://fsusblog_release/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        location = /api/notifications/stream {
            proxy_pass http://fsusblog_release/api/notifications/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        location = /src/assets/public-page.css {
            default_type text/css;
            add_header Cache-Control "no-store" always;
            return 200 "/* fsus local proxy noop public-page fallback */\n";
        }

        location = /src/assets/public-shell-critical.css {
            default_type text/css;
            add_header Cache-Control "no-store" always;
            return 200 "/* fsus local proxy noop public-shell-critical fallback */\n";
        }

        location = /__nginx_probe_7f3c2b {
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:;" always;
            proxy_pass http://fsusblog_release/api/System/seo;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $host;
            proxy_set_header User-Agent "Mozilla/5.0 (FsusBlog Local Nginx Probe)";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location / {
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:;" always;
            proxy_pass http://fsusblog_release/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $host;
            proxy_set_header User-Agent "Mozilla/5.0 (FsusBlog Local Nginx Proxy)";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
