# FsusBlog production OpenResty/Nginx gateway template.
# Replace fsus.blog, certificate paths, and optional www host before deployment.

map $http_upgrade $fsus_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=fsus_global_limit:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fsus_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fsus_admin_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=fsus_addr_limit:10m;

upstream fsusblog_kestrel {
    # Initialized by gateway-control.mjs; changed only by gateway-switch/rollback/recover.
    # The included file is exactly one generated loopback blue/green server line.
    include /etc/openresty/fsusblog/active-upstream.conf;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/fsus.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsus.blog/privkey.pem;

    return 444;
}

server {
    listen 80;
    server_name fsus.blog www.fsus.blog;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fsus.blog www.fsus.blog;

    ssl_certificate /etc/letsencrypt/live/fsus.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsus.blog/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FSUSSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1;

    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(bak|old|orig|save|sql|tar|gz|zip|7z|rar)$ {
        deny all;
    }

    location = /health/live {
        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /health/ready {
        # Public readiness intentionally returns only status + checkedAt.
        # Detailed readiness is /api/ops/health/ready-detail and is protected by admin auth in Kestrel.
        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/ops/health/ready-detail {
        limit_req zone=fsus_admin_limit burst=10 nodelay;
        limit_conn fsus_addr_limit 10;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/notifications/stream {
        limit_req zone=fsus_global_limit burst=30 nodelay;
        limit_conn fsus_addr_limit 20;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fsus_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://fsusblog_kestrel;
    }

    location ~ ^/(login|admin)(/|$) {
        limit_req zone=fsus_auth_limit burst=5 nodelay;
        limit_conn fsus_addr_limit 10;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/binary/auth(/|$) {
        limit_req zone=fsus_auth_limit burst=5 nodelay;
        limit_conn fsus_addr_limit 10;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/binary/admin(/|$) {
        limit_req zone=fsus_admin_limit burst=10 nodelay;
        limit_conn fsus_addr_limit 10;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/binary/author(/|$) {
        limit_req zone=fsus_admin_limit burst=10 nodelay;
        limit_conn fsus_addr_limit 10;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_req zone=fsus_global_limit burst=30 nodelay;
        limit_conn fsus_addr_limit 20;

        proxy_pass http://fsusblog_kestrel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
