# FsusBlog 开发环境覆盖配置 (修订日期: 2026-03-01)
# 逻辑自洽说明: 贯彻极简主义，彻底剥离开发环境的前端容器负担。
# 前端将在宿主机原生运行实现毫秒级 HMR，后端在此处由 dotnet watch 启动专注于 API 调试。
services:
  # 后端 API 调试配置
  fsusblog.server:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - ./FsusBlog.Server:/app
      - ~/.aspnet/https:/https:ro
    working_dir: /app
    command: ["dotnet", "watch", "run", "--project", "FsusBlog.Server.csproj", "--urls", "http://+:8080"]
    ports:
      # 宿主机通过 localhost:5173 直连后端的 8080 端口
      - "5173:8080"
    # 主文件中已有 networks，继承配置即可
    networks:
      # 核心修复：确保该开发模式下的容器强制加入同一网络
      - fsus-infra-network

  # =========================================================================
  #[修改日期 2026-03-01]
  # 物理剔除：原 fsusblog.client (前端 UI 调试容器) 已被完全移除。
  # 修改理由：
  # 1. 避免寻找已删除的 FsusBlog.Client/Dockerfile 导致引擎崩溃。
  # 2. 彻底消灭 WSL2/Docker 的跨文件系统 I/O 损耗，节约数 GB 开发内存。
  # =========================================================================