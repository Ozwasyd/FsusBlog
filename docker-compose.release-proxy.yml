services:
  fsusblog.app:
    container_name: fsusblog-app-release
    build:
      context: .
      dockerfile: FsusBlog.Server/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: fsusblogapp:release-proxy
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_TieredPGO: "1"
      DOTNET_TC_QuickJitForLoops: "1"
      DOTNET_ReadyToRun: "1"
      DOTNET_GCServer: "1"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      ConnectionStrings__DefaultConnection: Host=host.docker.internal;Port=5432;Database=fsusblog;Username=fsusblog;Password=fsusblog_dev
      ConnectionStrings__Redis: host.docker.internal:6379,abortConnect=false,connectTimeout=10000
      RedisOptions__Configuration: host.docker.internal:6379,abortConnect=false,connectTimeout=10000
      Jwt__SecretKey: DevMachine_FsusBlog_Release_Jwt_Key_2026_04_05_Change_Me
      CORS_ALLOWED_HOSTS: http://localhost:18080,http://127.0.0.1:18080
      Seo__BaseUrl: http://127.0.0.1:18080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - fsusblog_release_uploads:/app/wwwroot/uploads
      - fsusblog_release_lucene:/app/LuceneIndex

  fsusblog.nginx:
    container_name: fsusblog-nginx-release
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - fsusblog.app
    ports:
      - "18080:80"
    volumes:
      - ./deploy/devmachine/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  fsusblog_release_uploads:
  fsusblog_release_lucene:
