# FsusBlog 基础编排配置 (修订日期: 2026-03-01)
# 修正说明：架构演进为极简主义单容器部署，Kestrel 直接接管前端静态资产，彻底剥离 Nginx。

services:
  # 1. 业务核心：融合后的前后端全栈应用 (Kestrel 托管)
  fsusblog.server:
    build:
      context: .
      dockerfile: FsusBlog.Server/Dockerfile
    # [修改日期 2026-03-01] 逻辑自洽：容器重命名为 fsus-app，因为它现在同时包含了 UI 和 API
    container_name: fsus-app
    image: ${DOCKER_REGISTRY-}fsusblogapp
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 数据库连接：由外部 .env 驱动
      - ConnectionStrings__DefaultConnection=Host=${EXTERNAL_DB_HOST};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=${EXTERNAL_REDIS_HOST}:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=10000
      # Redis 连接：前缀对齐 appsettings.json 中的 RedisOptions 节点
      - RedisOptions__Configuration=${EXTERNAL_REDIS_HOST}:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=10000
      # CORS 配置：支持逗号分隔的动态域名字符串
      - CORS_ALLOWED_HOSTS=${CORS_ALLOWED_HOSTS}
      # 映射 SEO 基础地址
      - Seo__BaseUrl=${SITE_BASEURL}
    networks:
      - fsus-app-network
      - fsus-infra-network
    volumes:
      # 核心修复(2026-02-21)：使用具名卷替代物理路径挂载，解决 LuceneIndex 权限拒绝问题
      - fsus-uploads:/app/wwwroot/uploads
      - fsus-luceneindex:/app/LuceneIndex
    #[修改日期 2026-03-01] 
    # 物理对接：暴露出 Kestrel 的默认 8080 端口，供宿主机的 OpenResty/Nginx 网关直接反向代理
    ports:
      - "8080:8080"

  # =========================================================================
  # [修改日期 2026-03-01]
  # 物理剔除：原 fsusblog.client (Nginx) 服务已被完全移除，节约至少 50MB 基础内存。
  # =========================================================================

networks:
  fsus-app-network:
    driver: bridge
  fsus-infra-network:
    external: true # 假设基础设施网络（DB/Redis）已存在，符合生产环境安全性要求

# 定义具名卷，确保持久化数据由 Docker 引擎统一管理权限映射
volumes:
  fsus-uploads:
  fsus-luceneindex: