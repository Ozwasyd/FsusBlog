# FsusBlog 基础编排配置 (修订日期: 2026-03-01)
# 修正说明：架构演进为极简主义单容器部署，Kestrel 直接接管前端静态资产，彻底剥离 Nginx。

services:
  # 1. 业务核心：融合后的前后端全栈应用 (Kestrel 托管)
  fsusblog.server:
    build:
      context: ../..
      dockerfile: ops/docker/FsusBlog.Server.Dockerfile
      target: final
      args:
        GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN}
      secrets:
        - github_packages_token
    # [修改日期 2026-03-01] 逻辑自洽：容器重命名为 fsus-app，因为它现在同时包含了 UI 和 API
    container_name: fsus-app
    image: ${DOCKER_REGISTRY-}fsusblogapp
    restart: always
    stop_grace_period: 30s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 数据库连接：由外部 .env 驱动
      # Username=/Password= 是 PostgreSQL/Npgsql 连接串凭据关键字；不要在 appsettings*.json 中恢复 Admin:Username/Admin:Password/Admin:Role 应用身份配置。
      - ConnectionStrings__DefaultConnection=Host=${EXTERNAL_DB_HOST};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=${EXTERNAL_REDIS_HOST}:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=10000
      # Redis 连接：前缀对齐 appsettings.json 中的 RedisOptions 节点
      - RedisOptions__Configuration=${EXTERNAL_REDIS_HOST}:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=10000
      # CORS 配置：支持逗号分隔的动态域名字符串
      - CORS_ALLOWED_HOSTS=${CORS_ALLOWED_HOSTS}
      # Host / reverse-proxy trust boundary. 生产环境禁止 wildcard Host 和任意 X-Forwarded-* 来源。
      - AllowedHosts=${APP_ALLOWED_HOSTS}
      - ReverseProxy__KnownProxies=${REVERSE_PROXY_KNOWN_PROXIES:-127.0.0.1}
      - ReverseProxy__KnownNetworks=${REVERSE_PROXY_KNOWN_NETWORKS:-}
      # 映射 SEO 基础地址
      - Seo__BaseUrl=${SITE_BASEURL}
      # Passkey / WebAuthn 生产来源：Origins 必须与可信站点来源保持一致
      - Fido2__ServerDomain=${FIDO2_SERVER_DOMAIN}
      - Fido2__ServerName=${FIDO2_SERVER_NAME:-FsusBlog}
      - Fido2__Origins__0=${SITE_BASEURL}
    networks:
      - fsus-app-network
      - fsus-infra-network
    volumes:
      - fsus-uploads:/app/wwwroot/uploads
      - fsus-aot-cache:/app/wwwroot/aot-cache
      - fsus-logs:/app/Logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # 资源限制按 2C/2G VPS 的实用中高压基线给出；更高规格可通过 compose override 覆盖。
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    #[修改日期 2026-03-01]
    # 物理对接：Kestrel 仅绑定宿主机回环地址，公网只应进入 OpenResty/Nginx 的 80/443。
    ports:
      - "127.0.0.1:8080:8080"

  # =========================================================================
  # [修改日期 2026-03-01]
  # 物理剔除：原 fsusblog.client (Nginx) 服务已被完全移除，节约至少 50MB 基础内存。
  # =========================================================================

networks:
  fsus-app-network:
    driver: bridge
  fsus-infra-network:
    external: true # 假设基础设施网络（DB/Redis）已存在，符合生产环境安全性要求

# 定义具名卷，确保持久化数据由 Docker 引擎统一管理权限映射
volumes:
  fsus-uploads:
  fsus-aot-cache:
  fsus-logs:

secrets:
  github_packages_token:
    environment: GITHUB_PACKAGES_TOKEN
