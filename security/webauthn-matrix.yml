version: webauthn-matrix-v1
scenarios:
  - id: WEBAUTHN-RP-ID
    scenario: RP ID must match configured production domain and reject drift
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
      - src/backend/Infrastructure/Operations/ProductionStartupValidator.cs
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-ORIGIN
    scenario: browser origin must match allowed WebAuthn origins
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
      - docs/security.md
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-RESIDENT-KEY
    scenario: residentKey and discoverable credential policy is explicit
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-USER-VERIFICATION
    scenario: userVerification policy is explicit and challenge-bound
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-EXCLUDE-CREDENTIALS
    scenario: duplicate credential registration is blocked with excludeCredentials
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-COUNTER-CLONE
    scenario: signature counter and cloned credential replay are rejected
    owner: ServerContractAgent
    status: automated
    code:
      - src/backend/Services/Security/PasskeyService.cs
    tests:
      - tests/backend/FsusBlog.Server.Tests/Unit/PasskeyServiceTests.cs
    evidence:
