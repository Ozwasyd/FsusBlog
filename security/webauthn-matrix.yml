  - id: WEBAUTHN-CONDITIONAL-MEDIATION
    scenario: conditional mediation support is feature-detected and not required for baseline auth
    owner: InteropGlueAgent
    status: automated
    code:
      - src/frontend/src
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    tests:
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    evidence:
      - .tmp/security/attack-matrix.json

  - id: WEBAUTHN-BROWSER-MATRIX
    scenario: browser capability drift is tracked for Chromium, Firefox and WebKit
    owner: InteropGlueAgent
    status: planned-browser-expansion
    code:
      - src/frontend/playwright.config.ts
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    tests:
      - tests/frontend/checks/security/check-auth-passkey-smoke.mjs
    evidence:
      - src/frontend/test-results/playwright/security
