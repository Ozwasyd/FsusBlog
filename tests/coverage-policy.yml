version: fsusblog-coverage-policy-v1
thresholds:
    merged:
        line: 35
        branch: 20
        method: 30
        function: 30
    backend:
        line: 75
        branch: 55
        method: 95
    frontend:
        line: 0
        branch: 0
        function: 0
        statement: 0
excludedGeneratedFiles:
    - src/shared/Contracts/Validation/*.g.*
    - src/frontend/src/generated/**
temporaryExceptions:
    - metric: backend line coverage
      approvedUntil: 2026-07-31
      reason: release-final baseline exception while backend coverage expansion is scheduled
    - metric: backend branch coverage
      approvedUntil: 2026-07-31
      reason: release-final baseline exception while backend branch coverage expansion is scheduled
    - metric: frontend line coverage
      approvedUntil: 2026-07-31
      reason: release-final baseline exception while frontend view coverage expansion is scheduled
    - metric: frontend branch coverage
      approvedUntil: 2026-07-31
      reason: release-final baseline exception while frontend branch coverage expansion is scheduled
    - metric: critical backend module branch coverage
      approvedUntil: 2026-07-31
      reason: file-level critical backend coverage is unavailable from current cobertura summary
releaseFinal:
    backend:
        line: 85
        branch: 75
    frontend:
        line: 75
        branch: 65
    changedCode:
        line: 90
    criticalBackendModules:
        branch: 90
        exceptionRequired: true
        paths:
            - src/backend/Infrastructure/Auth/**
            - src/backend/Infrastructure/Middlewares/**
            - src/backend/Infrastructure/Operations/**
            - src/backend/Modules/Endpoints/Binary/**
        approvedExceptions: []
