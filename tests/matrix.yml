version: fsusblog-test-matrix-v2
namespaceTemplate: ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${MATRIX_JOB:-local}-${MATRIX_SHARD:-0}
tiers:
  - id: validate-matrix
    owner: ServerContractAgent
    command: node tools/run-test-matrix.mjs preflight
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 0
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: critical
    coverage: [test-dag]
    artifacts: [.tmp/release-evidence/test-plan.json]
    evidence: [.tmp/release-evidence/test-plan.json]
    ciJob: validate-matrix
    localOnly: false
    nightlyOnly: false

  - id: frontend-fast
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-fast.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 35
    shardable: true
    defaultShards: 2
    risk: high
    coverage: [frontend-unit, frontend-property, frontend-static, contract-static]
    artifacts: [src/frontend/coverage, .tmp/frontend]
    evidence: [src/frontend/coverage, .tmp/frontend]
    ciJob: fast-frontend-unit
    localOnly: false
    nightlyOnly: false

  - id: backend-fast
    owner: ServerContractAgent
    command: tools/test/lanes/backend-fast.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: backend
    timeoutMinutes: 35
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [backend-unit, backend-static]
    artifacts: [.tmp/gate-logs]
    evidence: [tests/backend/Fixtures/backend-test-requirements.json]
    ciJob: fast-backend
    localOnly: false
    nightlyOnly: false

  - id: static-governance
    owner: ServerContractAgent
    command: tools/test/lanes/static-governance.sh
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: critical
    coverage: [gate-integrity, matrix-integrity, evidence-schema]
    artifacts: [.tmp/gate-logs, .tmp/docs, .tmp/release-evidence/test-plan.json, .tmp/release-evidence/doc-sync-summary.json, .tmp/release-evidence/flaky/registry.json]
    evidence: [.tmp/gate-logs, .tmp/docs, .tmp/release-evidence/test-plan.json, .tmp/release-evidence/doc-sync-summary.json, .tmp/release-evidence/flaky/registry.json]
    ciJob: fast-static-governance
    localOnly: false
    nightlyOnly: false

  - id: fast
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh fast
    dependsOn: [frontend-fast, backend-fast, static-governance]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 50
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [frontend-unit-property-model-static, backend-unit]
    artifacts: [.tmp/gate-logs, src/frontend/coverage]
    evidence: [.tmp/gate-logs, src/frontend/coverage]
    ciJob: fast-summary
    localOnly: false
    nightlyOnly: false

  - id: coverage-backend
    owner: ServerContractAgent
    command: tools/coverage/collect-backend-coverage.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: backend
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [backend-coverage]
    artifacts: [.tmp/coverage/backend, .tmp/coverage/backend-merged]
    evidence: [.tmp/coverage/backend-merged/Summary.json]
    ciJob: coverage-backend
    localOnly: false
    nightlyOnly: false

  - id: coverage-frontend
    owner: InteropGlueAgent
    command: tools/coverage/collect-frontend-coverage.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [frontend-coverage]
    artifacts: [.tmp/coverage/frontend, src/frontend/coverage]
    evidence: [.tmp/coverage/frontend/Summary.json]
    ciJob: coverage-frontend
    localOnly: false
    nightlyOnly: false

  - id: coverage-merge
    owner: ServerContractAgent
    command: tools/coverage/merge-coverage.sh
    dependsOn: [coverage-backend, coverage-frontend]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: medium
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [merged-coverage]
    artifacts: [.tmp/coverage/merged]
    evidence: [.tmp/coverage/merged/Summary.json]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false

  - id: coverage-threshold
    owner: ServerContractAgent
    command: tools/test/lanes/coverage-threshold.sh
    dependsOn: [coverage-merge]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: high
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: critical
    coverage: [coverage-threshold]
    artifacts: [.tmp/coverage/scope-snapshot.json]
    evidence: [.tmp/coverage/scope-snapshot.json]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false

  - id: coverage-gate
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh coverage-gate
    dependsOn: [coverage-threshold]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: very-high
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 90
    shardable: false
    defaultShards: 1
    risk: critical
    coverage: [backend-frontend-merged]
    artifacts: [.tmp/coverage]
    evidence: [.tmp/coverage]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false

  - id: bootstrap
    owner: ServerContractAgent
    command: tools/test/lanes/bootstrap-acceptance-env.sh
    dependsOn: []
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: false
    exclusiveResources: [docker-compose, local-ports, redis-test-state]
    phase: 2
    cost: high
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [runtime-bootstrap]
    artifacts: [.tmp/acceptance]
    evidence: [.tmp/acceptance/*.log]
    ciJob: integration-runtime
    localOnly: false
    nightlyOnly: false

  - id: integration
    owner: ServerContractAgent
    command: tools/test/lanes/runtime-integration.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [debug-runtime]
    phase: 2
    cost: medium
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [runtime-contract-smoke]
    artifacts: [.tmp/acceptance/*.log, src/frontend/test-results/playwright/integration]
    evidence: [.tmp/acceptance/*.log]
    ciJob: integration-runtime
    localOnly: false
    nightlyOnly: false

  - id: ci
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh ci
    dependsOn: [fast, integration]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [debug-runtime]
    phase: 3
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 70
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [fast-plus-integration]
    artifacts: [.tmp/acceptance/*.log, .tmp/gate-logs]
    evidence: [.tmp/acceptance/*.log, .tmp/gate-logs]
    ciJob: ci-summary
    localOnly: true
    nightlyOnly: false

  - id: release
    owner: ServerContractAgent
    command: tools/test/lanes/release-public.sh
    dependsOn: [bootstrap]
    services: [backend, preview]
    parallelizable: false
    exclusiveResources: [release-preview]
    phase: 2
    cost: medium
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [release-preview-runtime, aot-hydration-pwa-seo]
    artifacts: [.tmp/acceptance/*.log, src/frontend/test-results/playwright/release]
    evidence: [.tmp/acceptance/*.log]
    ciJob: release-public
    localOnly: false
    nightlyOnly: false

  - id: security
    owner: ServerContractAgent
    command: tools/test/lanes/security-runtime.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [security-runtime-state, redis-test-state]
    phase: 3
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 40
    shardable: false
    defaultShards: 1
    risk: critical
    coverage: [auth-mfa-passkey-pow-permission-dast]
    artifacts: [.tmp/security, src/frontend/test-results/playwright/security]
    evidence: [.tmp/security]
    ciJob: security-runtime
    localOnly: false
    nightlyOnly: false

  - id: acceptance
    owner: InteropGlueAgent
    command: tools/test/lanes/acceptance-playwright.sh
    dependsOn: [fast, integration, release]
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: true
    exclusiveResources: [playwright-session]
    phase: 3
    cost: high
    resourceClass: browser
    maxParallel: 4
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: chromium
    playwrightWorkers: 1
    cacheProfile: full
    timeoutMinutes: 45
    shardable: true
    defaultShards: 4
    risk: high
    coverage: [playwright-acceptance]
    artifacts: [src/frontend/test-results/playwright/acceptance, src/frontend/playwright-report]
    evidence: [src/frontend/test-results/playwright/acceptance]
    ciJob: acceptance-playwright
    localOnly: false
    nightlyOnly: false

  - id: visual-public
    owner: InteropGlueAgent
    command: tools/test/lanes/visual-public-playwright.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: true
    exclusiveResources: [visual-public-screenshots]
    phase: 3
    cost: high
    resourceClass: browser
    maxParallel: 2
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: chromium
    playwrightWorkers: 2
    cacheProfile: full
    timeoutMinutes: 35
    shardable: true
    defaultShards: 2
    risk: medium
    coverage: [playwright-visual-public]
    artifacts: [.tmp/visual/public, src/frontend/test-results/playwright/visual-public]
    evidence: [.tmp/visual/public, src/frontend/test-results/playwright/visual-public]
    ciJob: visual-public-playwright
    localOnly: false
    nightlyOnly: false

  - id: visual-console
    owner: InteropGlueAgent
    command: tools/test/lanes/visual-console-playwright.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: true
    exclusiveResources: [visual-console-screenshots]
    phase: 3
    cost: high
    resourceClass: browser
    maxParallel: 2
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: chromium
    playwrightWorkers: 2
    cacheProfile: full
    timeoutMinutes: 35
    shardable: true
    defaultShards: 2
    risk: medium
    coverage: [playwright-visual-console]
    artifacts: [.tmp/visual/console, src/frontend/test-results/playwright/visual-console]
    evidence: [.tmp/visual/console, src/frontend/test-results/playwright/visual-console]
    ciJob: visual-console-playwright
    localOnly: false
    nightlyOnly: false

  - id: visual
    owner: InteropGlueAgent
    command: tools/test/lanes/visual-screenshots-aggregate.sh
    dependsOn: [visual-public, visual-console]
    services: []
    parallelizable: false
    exclusiveResources: [visual-screenshot-aggregate]
    phase: 3
    cost: low
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: medium
    coverage: [playwright-visual-aggregate]
    artifacts: [.tmp/visual/summary.json, .tmp/release-evidence/visual-screenshot-summary.json]
    evidence: [.tmp/visual/summary.json, .tmp/release-evidence/visual-screenshot-summary.json]
    ciJob: visual-playwright
    localOnly: false
    nightlyOnly: false

  - id: ux-viewport-smoke
    owner: InteropGlueAgent
    command: tools/test/lanes/ux-viewport-smoke.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend, preview]
