version: fsusblog-test-matrix-v2
namespaceTemplate: ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${MATRIX_JOB:-local}-${MATRIX_SHARD:-0}
localProfiles:
  production:
    budgetMs: 1800000
    maxParallel: 8
    cpuUnits: 8
    memoryGiB: 10
    maxInitialLoad1: 4
    summaryOnly: [security-authenticated-dast]
    bundles:
      - id: build-static
        command: tools/test/bundles/build-static.sh
        budgetMs: 180000
        dependsOn: []
        members: [frontend-build, frontend-runtime-contracts, frontend-static-governance, validate-matrix, public-hydration-fast, wasm-fuzz-regression, contract-fuzz, perception-v2-redteam-pr, risk-control-test-matrix, ux-viewport-plan-progress]
        resourceClass: cpu
        cpuUnits: 2
        memoryGiB: 3
        stepMaxParallel: 2
        artifactSubstitutions: [frontend-build::.tmp/frontend/timings/frontend-build.json=>.tmp/local-production/build-static/member-summaries/frontend-build/summary.json|.tmp/frontend/frontend-build.json, frontend-runtime-contracts::.tmp/frontend/frontend-runtime-contracts.json=>.tmp/local-production/build-static/member-summaries/frontend-runtime-contracts/summary.json, frontend-runtime-contracts::.tmp/frontend/timings/frontend-runtime-contracts.json=>.tmp/local-production/build-static/member-summaries/frontend-runtime-contracts/summary.json, frontend-static-governance::.tmp/frontend/frontend-static-governance.json=>.tmp/local-production/build-static/member-summaries/frontend-static-governance/summary.json, frontend-static-governance::.tmp/frontend/timings/frontend-static-governance.json=>.tmp/local-production/build-static/member-summaries/frontend-static-governance/summary.json]
        exclusiveResources: [build-output, static-web-assets]
      - id: backend-tests
        command: tools/test/bundles/backend-tests.sh
        budgetMs: 240000
        dependsOn: []
        members: [backend-build-governance, integrity-proof-verification, perception-v2-test-matrix, backend-unit, backend-api-integration, backend-auth-state-machine, backend-concurrency, backend-property, backend-golden, backend-fast, coverage-backend]
        resourceClass: cpu
        cpuUnits: 4
        memoryGiB: 4
        stepMaxParallel: 4
        artifactSubstitutions: [backend-build-governance::.tmp/backend-build-governance=>.tmp/local-production/backend-tests/member-summaries/backend-build-governance/summary.json, backend-unit::.tmp/backend-unit=>.tmp/local-production/backend-tests/member-summaries/backend-unit/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-fast::.tmp/backend-fast=>.tmp/local-production/backend-tests/member-summaries/backend-fast/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-api-integration::.tmp/backend-api-integration=>.tmp/local-production/backend-tests/member-summaries/backend-api-integration/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-api-integration::.tmp/coverage/backend/special-api-integration/**/coverage.cobertura.xml=>.tmp/local-production/backend-tests/member-summaries/backend-api-integration/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-api-integration::.tmp/coverage/backend/special-api-integration/**/coverage.json=>.tmp/local-production/backend-tests/member-summaries/backend-api-integration/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-auth-state-machine::.tmp/backend-auth-state-machine=>.tmp/local-production/backend-tests/member-summaries/backend-auth-state-machine/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-auth-state-machine::.tmp/coverage/backend/special-auth-state-machine/**/coverage.cobertura.xml=>.tmp/local-production/backend-tests/member-summaries/backend-auth-state-machine/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-auth-state-machine::.tmp/coverage/backend/special-auth-state-machine/**/coverage.json=>.tmp/local-production/backend-tests/member-summaries/backend-auth-state-machine/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-concurrency::.tmp/backend-concurrency=>.tmp/local-production/backend-tests/member-summaries/backend-concurrency/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-concurrency::.tmp/coverage/backend/special-concurrency/**/coverage.cobertura.xml=>.tmp/local-production/backend-tests/member-summaries/backend-concurrency/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-concurrency::.tmp/coverage/backend/special-concurrency/**/coverage.json=>.tmp/local-production/backend-tests/member-summaries/backend-concurrency/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-property::.tmp/backend-property=>.tmp/local-production/backend-tests/member-summaries/backend-property/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-property::.tmp/coverage/backend/special-property/**/coverage.cobertura.xml=>.tmp/local-production/backend-tests/member-summaries/backend-property/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-property::.tmp/coverage/backend/special-property/**/coverage.json=>.tmp/local-production/backend-tests/member-summaries/backend-property/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-golden::.tmp/backend-golden=>.tmp/local-production/backend-tests/member-summaries/backend-golden/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-golden::.tmp/coverage/backend/special-golden/**/coverage.cobertura.xml=>.tmp/local-production/backend-tests/member-summaries/backend-golden/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json, backend-golden::.tmp/coverage/backend/special-golden/**/coverage.json=>.tmp/local-production/backend-tests/member-summaries/backend-golden/summary.json|.tmp/test-results/backend/production/summary.json|.tmp/coverage/backend-merged/Summary.json]
        exclusiveResources: [backend-test-results]
      - id: frontend-tests
        command: tools/test/bundles/frontend-tests.sh
        budgetMs: 240000
        dependsOn: []
        members: [frontend-unit-shard, frontend-property-model-perf, frontend-fast-summary, coverage-frontend]
        resourceClass: cpu
        cpuUnits: 2
        memoryGiB: 3
        stepMaxParallel: 2
        artifactSubstitutions: [frontend-unit-shard::.tmp/frontend/frontend-unit-shard.json=>.tmp/local-production/frontend-tests/member-summaries/frontend-unit-shard/summary.json|.tmp/coverage/frontend/Summary.json, frontend-unit-shard::.tmp/frontend/timings/frontend-unit-shard.json=>.tmp/local-production/frontend-tests/member-summaries/frontend-unit-shard/summary.json|.tmp/coverage/frontend/Summary.json, frontend-property-model-perf::.tmp/frontend/frontend-property-model-perf.json=>.tmp/local-production/frontend-tests/member-summaries/frontend-property-model-perf/summary.json|.tmp/coverage/frontend/Summary.json, frontend-property-model-perf::.tmp/frontend/timings/frontend-property-model-perf.json=>.tmp/local-production/frontend-tests/member-summaries/frontend-property-model-perf/summary.json|.tmp/coverage/frontend/Summary.json, frontend-property-model-perf::.tmp/test-results/vitest/property=>.tmp/local-production/frontend-tests/member-summaries/frontend-property-model-perf/summary.json|.tmp/test-results/vitest/production-coverage, frontend-property-model-perf::.tmp/test-results/vitest/model=>.tmp/local-production/frontend-tests/member-summaries/frontend-property-model-perf/summary.json|.tmp/test-results/vitest/production-coverage, frontend-fast-summary::.tmp/frontend=>.tmp/local-production/frontend-tests/member-summaries/frontend-fast-summary/summary.json|.tmp/coverage/frontend/Summary.json, frontend-fast-summary::src/frontend/dist=>.tmp/local-production/build-static/member-summaries/frontend-build/summary.json|.tmp/frontend/frontend-build.json, frontend-property-model-perf::.tmp/test-results/vitest/perf=>.tmp/local-production/frontend-tests/member-summaries/frontend-property-model-perf/summary.json|.tmp/test-results/vitest/production]
        exclusiveResources: [frontend-test-results]
      - id: runtime-browser
        command: tools/test/bundles/runtime-browser.sh
        budgetMs: 900000
        dependsOn: [build-static, backend-tests, frontend-tests]
        members: [bootstrap, release, integration, endpoint-depth, security, acceptance, cross-browser-smoke, visual-public, visual-console, visual, ux-viewport-smoke, frontend-render-pressure, resilience, rights-v3-test-matrix, data-scale-xs, data-scale-s, data-scale-evidence-summary, csrf-browser-matrix, fault-injection, cross-stack-contract, privacy-zk-comment-matrix, static-governance]
        resourceClass: browser
        cpuUnits: 8
        memoryGiB: 10
        stepMaxParallel: 8
        exclusiveResources: [runtime-services, database-writes, benchmark-window]
      - id: performance-evidence
        command: tools/test/bundles/performance-evidence.sh
        budgetMs: 480000
        dependsOn: [runtime-browser]
        members: [fast, coverage-merge, coverage-threshold, coverage-gate, load, backend-qps-view-count-flush, backend-qps-visitlog-invalidation, backend-qps-cache-hit, backend-qps-comment-cursor, backend-qps-hotread, backend-qps-cache-miss-singleflight, backend-qps-risk-filter, backend-qps-related-reading, backend-qps-list-pagination, backend-qps-article-detail-miss, backend-qps-cache-registry, backend-cache-invalidation-batch, backend-qps-index-plan, backend-qps, load-baseline, load-peak, backend-benchmark-regression, browser-performance-regression, performance-evidence-summary, backend-perf, release-evidence, production, aeds-frame-cost, aeds-compression-profile]
        resourceClass: benchmark
        cpuUnits: 8
        memoryGiB: 10
        stepMaxParallel: 8
        exclusiveResources: [load-window, database-writes, benchmark-window]
tiers:
  - id: validate-matrix
    owner: ServerContractAgent
    command: node tools/run-test-matrix.mjs preflight
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 0
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [test-dag]
    artifacts: [.tmp/release-evidence/test-plan.json]
    evidence: [.tmp/release-evidence/test-plan.json]
    ciJob: validate-matrix
    localOnly: false
    nightlyOnly: false

  - id: pr-smart-gate-plan
    owner: ServerContractAgent
    command: node tools/run-test-matrix.mjs ci-pr-plan --out .tmp/pr-plan.json
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 0
    cost: low
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [pr-smart-gate-plan]
    artifacts: [.tmp/pr-plan.json, .tmp/release-evidence/pr-smart-gate-summary.json]
    evidence: [.tmp/release-evidence/pr-smart-gate-summary.json]
    ciJob: plan-pr-risk
    localOnly: false
    nightlyOnly: false
    prDefault: true
    smartGateMode: always
    retentionClass: must-keep
    triggerReason: PR smart gate plan and skip evidence must always be generated

  - id: frontend-build
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-build.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: [static-web-assets]
    phase: 1
    cost: medium
    resourceClass: cpu
    maxParallel: 4
    cpuUnits: 3
    memoryGiB: 3
    executionKey: frontend-release-build
    executionVariant: ordinary
    cacheInputs: [src/frontend/package.json, src/frontend/package-lock.json, src/frontend/tsconfig*.json, src/frontend/vite.config.ts, src/frontend/scripts, src/frontend/src, src/frontend/wasm, tools/frontend, tools/test/lanes/frontend-build.sh, tools/test/legacy-test.sh]
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-build]
    artifacts: [.tmp/frontend/frontend-build.json, .tmp/frontend/timings/frontend-build.json, src/frontend/dist, src/backend/wwwroot]
    evidence: [.tmp/frontend/frontend-build.json, .tmp/frontend/timings/frontend-build.json]
    ciJob: frontend-build
    localOnly: false
    nightlyOnly: false

  - id: frontend-unit-shard
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-unit-shard.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    cpuUnits: 3
    memoryGiB: 3
    executionKey: frontend-unit-tests
    executionVariant: ordinary
    cacheInputs: [src/frontend/package.json, src/frontend/package-lock.json, src/frontend/vitest.config.ts, src/frontend/vitest.shared.mjs, src/frontend/src, tests/frontend/unit, tools/test/lanes/frontend-unit-shard.sh, tools/test/legacy-test.sh]
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 25
    shardable: true
    defaultShards: 2
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-unit]
    artifacts: [.tmp/frontend/frontend-unit-shard.json, .tmp/frontend/timings/frontend-unit-shard.json]
    evidence: [.tmp/frontend/frontend-unit-shard.json, .tmp/frontend/timings/frontend-unit-shard.json]
    ciJob: fast-frontend-unit
    localOnly: false
    nightlyOnly: false

  - id: frontend-property-model-perf
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-property-model-perf.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 2
    cpuUnits: 2
    memoryGiB: 2
    executionKey: frontend-property-model-perf
    executionVariant: property
    cacheInputs: [src/frontend/package.json, src/frontend/package-lock.json, src/frontend/vitest.shared.mjs, src/frontend/vitest.property.config.ts, src/frontend/vitest.model.config.ts, src/frontend/vitest.perf.config.ts, src/frontend/src, tests/frontend/property, tests/frontend/model, tests/frontend/benchmarks, tools/test/lanes/frontend-property-model-perf.sh, tools/test/legacy-test.sh]
