version: fsusblog-test-matrix-v2
namespaceTemplate: ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${MATRIX_JOB:-local}-${MATRIX_SHARD:-0}
tiers:
  - id: validate-matrix
    owner: ServerContractAgent
    command: node tools/run-test-matrix.mjs preflight
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 0
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [test-dag]
    artifacts: [.tmp/release-evidence/test-plan.json]
    evidence: [.tmp/release-evidence/test-plan.json]
    ciJob: validate-matrix
    localOnly: false
    nightlyOnly: false

  - id: pr-smart-gate-plan
    owner: ServerContractAgent
    command: node tools/run-test-matrix.mjs ci-pr-plan --out .tmp/pr-plan.json
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 0
    cost: low
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [pr-smart-gate-plan]
    artifacts: [.tmp/pr-plan.json, .tmp/release-evidence/pr-smart-gate-summary.json]
    evidence: [.tmp/release-evidence/pr-smart-gate-summary.json]
    ciJob: plan-pr-risk
    localOnly: false
    nightlyOnly: false
    prDefault: true
    smartGateMode: always
    retentionClass: must-keep
    triggerReason: PR smart gate plan and skip evidence must always be generated

  - id: frontend-build
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-build.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: medium
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-build]
    artifacts: [.tmp/frontend/frontend-build.json, .tmp/frontend/frontend-fast-groups.json, src/frontend/dist]
    evidence: [.tmp/frontend/frontend-build.json, .tmp/frontend/frontend-fast-groups.json]
    ciJob: frontend-build
    localOnly: false
    nightlyOnly: false

  - id: frontend-unit-shard
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-unit-shard.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 25
    shardable: true
    defaultShards: 2
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-unit, frontend-property]
    artifacts: [src/frontend/coverage, .tmp/frontend/frontend-unit-shard.json, .tmp/frontend/frontend-fast-groups.json]
    evidence: [src/frontend/coverage, .tmp/frontend/frontend-unit-shard.json, .tmp/frontend/frontend-fast-groups.json]
    ciJob: fast-frontend-unit
    localOnly: false
    nightlyOnly: false

  - id: frontend-runtime-contracts
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-runtime-contracts.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [contract-static]
    artifacts: [.tmp/frontend/frontend-runtime-contracts.json, .tmp/frontend/frontend-fast-groups.json]
    evidence: [.tmp/frontend/frontend-runtime-contracts.json, .tmp/frontend/frontend-fast-groups.json]
    ciJob: frontend-runtime-contracts
    localOnly: false
    nightlyOnly: false

  - id: frontend-static-governance
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-static-governance.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-static]
    artifacts: [.tmp/frontend/frontend-static-governance.json, .tmp/frontend/frontend-fast-groups.json]
    evidence: [.tmp/frontend/frontend-static-governance.json, .tmp/frontend/frontend-fast-groups.json]
    ciJob: frontend-static-governance
    localOnly: false
    nightlyOnly: false

  - id: frontend-fast-summary
    owner: InteropGlueAgent
    command: tools/test/lanes/noop.sh frontend-fast-summary
    dependsOn: [frontend-build, frontend-unit-shard, frontend-runtime-contracts, frontend-static-governance]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: low
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: []
    artifacts: [.tmp/frontend, src/frontend/coverage, src/frontend/dist]
    evidence: [.tmp/frontend, src/frontend/coverage]
    ciJob: fast-summary
    localOnly: false
    nightlyOnly: false

  - id: backend-fast
    owner: ServerContractAgent
    command: tools/test/lanes/backend-fast.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: backend
    timeoutMinutes: 35
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [backend-unit, backend-static]
    artifacts: [.tmp/gate-logs]
    evidence: [tests/backend/Fixtures/backend-test-requirements.json]
    ciJob: fast-backend
    localOnly: false
    nightlyOnly: false

  - id: integrity-proof-verification
    owner: ServerContractAgent
    command: tools/test/lanes/integrity-proof-verification.sh
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: medium
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: backend
    timeoutMinutes: 15
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [integrity-proof-verification, integrity-proof-tamper-matrix, integrity-proof-schema-migration, integrity-proof-release-evidence]
    artifacts: [.tmp/release-evidence/integrity-proof-verification.json]
    evidence: [.tmp/release-evidence/integrity-proof-verification.json]
    ciJob: fast-backend
    localOnly: false
    nightlyOnly: false

  - id: rights-v3-test-matrix
    owner: ServerContractAgent
    command: tools/test/lanes/rights-v3-test-matrix.sh
    dependsOn: [validate-matrix]
    services: [postgres]
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: production
    coverage: [rights-v3-test-matrix]
    artifacts: [.tmp/release-evidence/rights-v3-test-matrix.json]
    evidence: [.tmp/release-evidence/rights-v3-test-matrix.json]
    ciJob: integration-runtime
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: must-keep
    triggerPaths: [src/backend, src/shared, src/core, src/frontend, tests/backend, tests/frontend, tools/test/lanes]
    triggerFiles: [tests/matrix.yml, tests/coverage-registry.json, docs/testing.md]
    triggerCoverage: [rights-v3-test-matrix]
    triggerReason: Rights V3 schema, codec, frontend contract, artifact hot path, or test matrix inputs changed

  - id: static-governance
    owner: ServerContractAgent
    command: tools/test/lanes/static-governance.sh
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: fast
    coverage: [gate-integrity, matrix-integrity, evidence-schema, test-retention-classification, integrity-proof-docs-consistency]
    artifacts: [.tmp/gate-logs, .tmp/docs, .tmp/release-evidence/test-plan.json, .tmp/release-evidence/doc-sync-summary.json, .tmp/release-evidence/test-retention-audit.json, .tmp/release-evidence/flaky/registry.json, .tmp/docs/integrity-proof-docs.json]
    evidence: [.tmp/gate-logs, .tmp/docs, .tmp/release-evidence/test-plan.json, .tmp/release-evidence/doc-sync-summary.json, .tmp/release-evidence/test-retention-audit.json, .tmp/release-evidence/flaky/registry.json, .tmp/docs/integrity-proof-docs.json]
    ciJob: fast-static-governance
    localOnly: false
    nightlyOnly: false

  - id: public-hydration-fast
    owner: ServerContractAgent
    command: tools/test/lanes/public-hydration-fast.sh
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: low
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [public-hydration-fast-matrix, public-hydration-governance]
    artifacts: [.tmp/release-evidence/public-hydration-matrix-summary.json]
    evidence: [.tmp/release-evidence/public-hydration-matrix-summary.json]
    ciJob: fast-static-governance
    localOnly: false
    nightlyOnly: false

  - id: fast
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh fast
    dependsOn: [frontend-fast-summary, backend-fast, integrity-proof-verification, static-governance, public-hydration-fast]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 50
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-unit-property-model-static, backend-unit]
    artifacts: [.tmp/gate-logs, src/frontend/coverage]
    evidence: [.tmp/gate-logs, src/frontend/coverage]
    ciJob: fast-summary
    localOnly: false
    nightlyOnly: false

  - id: coverage-backend
    owner: ServerContractAgent
    command: tools/coverage/collect-backend-coverage.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: backend
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [backend-coverage]
    artifacts: [.tmp/coverage/backend, .tmp/coverage/backend-merged]
    evidence: [.tmp/coverage/backend-merged/Summary.json]
    ciJob: coverage-backend
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: conditional
    triggerPaths: [src/backend, src/shared, src/core, tests/backend, tools/coverage]
    triggerFiles: [tests/coverage-policy.yml, tests/coverage-registry.json, tests/matrix.yml]
    triggerCoverage: [backend-coverage]
    triggerReason: backend source, backend tests, or coverage governance changed

  - id: coverage-frontend
    owner: InteropGlueAgent
    command: tools/coverage/collect-frontend-coverage.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [frontend-coverage]
    artifacts: [.tmp/coverage/frontend, src/frontend/coverage]
    evidence: [.tmp/coverage/frontend/Summary.json]
    ciJob: coverage-frontend
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: conditional
    triggerPaths: [src/frontend, tests/frontend, tools/coverage]
    triggerFiles: [tests/coverage-policy.yml, tests/coverage-registry.json, tests/matrix.yml]
    triggerCoverage: [frontend-coverage]
    triggerReason: frontend source, frontend tests, or coverage governance changed

  - id: coverage-merge
    owner: ServerContractAgent
    command: tools/coverage/merge-coverage.sh
    dependsOn: [coverage-backend, coverage-frontend]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: medium
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [merged-coverage]
    artifacts: [.tmp/coverage/merged]
    evidence: [.tmp/coverage/merged/Summary.json]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: conditional
    triggerPaths: [src/backend, src/shared, src/core, src/frontend, tests/backend, tests/frontend, tools/coverage]
    triggerFiles: [tests/coverage-policy.yml, tests/coverage-registry.json, tests/matrix.yml]
    triggerCoverage: [merged-coverage]
    triggerReason: full coverage inputs or coverage governance changed

  - id: coverage-threshold
    owner: ServerContractAgent
    command: tools/test/lanes/coverage-threshold.sh
    dependsOn: [coverage-merge]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: high
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: production
    coverage: [coverage-threshold]
    artifacts: [.tmp/coverage/scope-snapshot.json]
    evidence: [.tmp/coverage/scope-snapshot.json]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: must-keep
    triggerPaths: [src/backend, src/shared, src/core, src/frontend, tests/backend, tests/frontend, tools/coverage]
    triggerFiles: [tests/coverage-policy.yml, tests/coverage-registry.json, tests/matrix.yml]
    triggerCoverage: [coverage-threshold]
    triggerReason: strict coverage inputs or coverage governance changed

  - id: coverage-gate
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh coverage-gate
    dependsOn: [coverage-threshold]
    services: []
    parallelizable: false
    exclusiveResources: [coverage-root]
    phase: 4
    cost: very-high
    resourceClass: io
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 90
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: production
    coverage: [backend-frontend-merged]
    artifacts: [.tmp/coverage]
    evidence: [.tmp/coverage]
    ciJob: coverage-merge-threshold
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: must-keep
    triggerPaths: [src/backend, src/shared, src/core, src/frontend, tests/backend, tests/frontend, tools/coverage]
    triggerFiles: [tests/coverage-policy.yml, tests/coverage-registry.json, tests/matrix.yml]
    triggerCoverage: [backend-frontend-merged]
    triggerReason: full coverage gate inputs or coverage governance changed

  - id: bootstrap
    owner: ServerContractAgent
    command: tools/test/lanes/bootstrap-acceptance-env.sh
    dependsOn: []
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: false
    exclusiveResources: [docker-compose, local-ports, redis-test-state]
    phase: 2
    cost: high
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    selfBootstraps: true
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [runtime-bootstrap]
    artifacts: [.tmp/acceptance]
    evidence: [.tmp/acceptance/*.log]
    ciJob: integration-runtime
    localOnly: false
    nightlyOnly: false

  - id: integration
    owner: ServerContractAgent
    command: tools/test/lanes/runtime-integration.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [debug-runtime]
    phase: 2
    cost: medium
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [runtime-contract-smoke]
    artifacts: [.tmp/acceptance/*.log, src/frontend/test-results/playwright/integration]
    evidence: [.tmp/acceptance/*.log]
    ciJob: integration-runtime
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: conditional
    triggerPaths: [src/backend, src/shared, tests/backend/Integration, tests/frontend/checks/runtime, tests/frontend/checks/resilience, tools/bootstrap-acceptance-env.sh]
    triggerFiles: [tests/matrix.yml, tests/contracts/openapi-policy.yml]
    triggerCoverage: [runtime-contract-smoke]
    triggerReason: backend runtime, API contract, auth, cache, DB, or runtime smoke inputs changed

  - id: ci
    owner: ServerContractAgent
    command: tools/test/lanes/noop.sh ci
    dependsOn: [fast, integration]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [debug-runtime]
    phase: 3
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 70
    shardable: false
    defaultShards: 1
    risk: high
    cadence: push
    requiredFor: none
    coverage: [fast-plus-integration]
    artifacts: [.tmp/acceptance/*.log, .tmp/gate-logs]
    evidence: [.tmp/acceptance/*.log, .tmp/gate-logs]
    ciJob: ci-summary
    localOnly: true
    nightlyOnly: false

  - id: release
    owner: ServerContractAgent
    command: tools/test/lanes/release-public.sh
    dependsOn: [bootstrap]
    services: [backend, preview]
    parallelizable: false
    exclusiveResources: [release-preview]
    phase: 2
    cost: medium
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: production
    coverage: [release-preview-runtime, aot-hydration-pwa-seo, public-hydration-clock-matrix, public-hydration-browser-env-matrix, public-hydration-payload-fixture-matrix, public-hydration-dom-diff, public-hydration-sidecar, public-hydration-matrix]
    artifacts: [.tmp/acceptance/*.log, .tmp/release-evidence/public-hydration-detector-summary.json, .tmp/release-evidence/public-hydration-clock-matrix-summary.json, .tmp/release-evidence/public-hydration-browser-env-summary.json, .tmp/release-evidence/public-hydration-payload-fixture-summary.json, .tmp/release-evidence/public-hydration-dom-diff-summary.json, .tmp/release-evidence/public-hydration-sidecar-summary.json, .tmp/release-evidence/public-hydration-matrix-summary.json, src/frontend/test-results/playwright/release]
    evidence: [.tmp/acceptance/*.log, .tmp/release-evidence/public-hydration-detector-summary.json, .tmp/release-evidence/public-hydration-clock-matrix-summary.json, .tmp/release-evidence/public-hydration-browser-env-summary.json, .tmp/release-evidence/public-hydration-payload-fixture-summary.json, .tmp/release-evidence/public-hydration-dom-diff-summary.json, .tmp/release-evidence/public-hydration-sidecar-summary.json, .tmp/release-evidence/public-hydration-matrix-summary.json]
    ciJob: release-public
    localOnly: false
    nightlyOnly: false
    smartGateMode: conditional
    retentionClass: conditional
    triggerPaths: [src/backend/Infrastructure/PublicAot, src/backend/Modules/Endpoints/PublicAotEndpoints.cs, src/frontend/src/public-renderers, src/frontend/src/components/public, src/frontend/src/bootstrap, tests/frontend/checks/public, tools/frontend]
    triggerFiles: [tests/matrix.yml, docs/testing.md]
    triggerCoverage: [release-preview-runtime, aot-hydration-pwa-seo, public-hydration-matrix]
    triggerReason: public renderer, AOT, hydration, SEO, PWA, or release preview inputs changed

  - id: public-hydration-nightly
    owner: InteropGlueAgent
    command: tools/test/lanes/public-hydration-nightly.sh
    dependsOn: [validate-matrix]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 4
    cost: very-high
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 10
    shardable: false
    defaultShards: 1
    risk: high
    cadence: nightly
    requiredFor: none
    coverage: [public-hydration-nightly-full-matrix, public-hydration-shard-strategy]
    artifacts: [.tmp/release-evidence/public-hydration-matrix-summary.json]
    evidence: [.tmp/release-evidence/public-hydration-matrix-summary.json]
    ciJob: public-hydration-nightly
    localOnly: false
    nightlyOnly: true

  - id: security
    owner: ServerContractAgent
    command: tools/test/lanes/security-runtime.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend]
    parallelizable: false
    exclusiveResources: [security-runtime-state, redis-test-state]
    phase: 3
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 40
    shardable: false
    defaultShards: 1
    risk: critical
    cadence: pr
    requiredFor: production
    coverage: [auth-mfa-passkey-pow-permission-dast]
    artifacts: [.tmp/security, src/frontend/test-results/playwright/security]
    evidence: [.tmp/security]
    ciJob: security-runtime
    localOnly: false
    nightlyOnly: false
