  - id: rights-v3-test-matrix
    owner: ServerContractAgent
    command: tools/test/lanes/rights-v3-test-matrix.sh
    dependsOn: [validate-matrix]
    services: [postgres]
    parallelizable: true
    exclusiveResources: []
    phase: 2
    cost: high
    resourceClass: database
    maxParallel: 1
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 25
    shardable: false
    defaultShards: 1
    risk: critical
