    evidence: [.tmp/ux/viewport-boundaries.json, .tmp/ux/screenshots/boundaries, .tmp/release-evidence/ux-viewport-summary.json]
    ciJob: ux-viewport-boundaries
    localOnly: false
    nightlyOnly: true

  - id: frontend-render-pressure
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-render-pressure.sh
    dependsOn: [bootstrap]
    services: [postgres, redis, backend, frontend, preview]
    parallelizable: false
    exclusiveResources: [playwright-render-pressure]
    phase: 3
    cost: high
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 35
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [dom-budget, dom-depth-static, route-render-pressure, markdown-render-budget]
    artifacts: [.tmp/frontend/dom-budget.json, .tmp/frontend/dom-budget, .tmp/frontend/route-render-pressure.json, .tmp/frontend/markdown-render-budget.json, .tmp/frontend/dom-depth-static.json, .tmp/release-evidence/frontend-render-pressure-summary.json]
    evidence: [.tmp/frontend/dom-budget.json, .tmp/frontend/route-render-pressure.json, .tmp/frontend/markdown-render-budget.json, .tmp/frontend/dom-depth-static.json, .tmp/release-evidence/frontend-render-pressure-summary.json]
    ciJob: frontend-render-pressure
    localOnly: false
