    artifacts: [.tmp/perf]
    evidence: [.tmp/perf]
    ciJob: load-smoke
    localOnly: false
    nightlyOnly: false

  - id: endpoint-depth
    owner: ServerContractAgent
    command: tools/test/lanes/endpoint-depth.sh
