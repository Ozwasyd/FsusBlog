    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-property]
    artifacts: [.tmp/frontend/frontend-property-model-perf.json, .tmp/frontend/timings/frontend-property-model-perf.json, .tmp/test-results/vitest/property, .tmp/test-results/vitest/model, .tmp/test-results/vitest/perf]
    evidence: [.tmp/frontend/frontend-property-model-perf.json, .tmp/frontend/timings/frontend-property-model-perf.json]
    ciJob: fast-frontend-unit
    localOnly: false
    nightlyOnly: false

  - id: frontend-runtime-contracts
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-runtime-contracts.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    cpuUnits: 2
    memoryGiB: 2
    executionKey: frontend-runtime-contracts
    executionVariant: runtime
    cacheInputs: [src/frontend/package.json, src/frontend/package-lock.json, src/frontend/src, src/frontend/wasm, tests/frontend/checks/runtime, tests/frontend/checks/security, tests/frontend/checks/wasm, tests/frontend/support, tools/frontend/ensure-wasm.mjs, tools/frontend/install-wasm-codec-deps.sh, tools/test/lanes/frontend-runtime-contracts.sh, tools/test/legacy-test.sh, tools/test/run-command-manifest.mjs, tools/test/run-once.mjs]
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [contract-static]
    artifacts: [.tmp/frontend/frontend-runtime-contracts.json, .tmp/frontend/timings/frontend-runtime-contracts.json]
    evidence: [.tmp/frontend/frontend-runtime-contracts.json, .tmp/frontend/timings/frontend-runtime-contracts.json]
    ciJob: frontend-runtime-contracts
    localOnly: false
    nightlyOnly: false

  - id: frontend-static-governance
    owner: InteropGlueAgent
    command: tools/test/lanes/frontend-static-governance.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    cpuUnits: 2
    memoryGiB: 2
    executionKey: frontend-static-governance
    executionVariant: ordinary
    cacheInputs: [src/frontend/package.json, src/frontend/src, tests/frontend/checks/static, tests/frontend/checks/ux, tests/frontend/support, tools/check-*.mjs, tools/test/lanes/frontend-static-governance.sh, tools/test/legacy-test.sh, tools/test/run-command-manifest.mjs]
    requiresBootstrap: none
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: [frontend-static]
    artifacts: [.tmp/frontend/frontend-static-governance.json, .tmp/frontend/timings/frontend-static-governance.json]
    evidence: [.tmp/frontend/frontend-static-governance.json, .tmp/frontend/timings/frontend-static-governance.json]
    ciJob: frontend-static-governance
    localOnly: false
    nightlyOnly: false

  - id: frontend-fast-summary
    owner: InteropGlueAgent
    command: tools/test/lanes/noop.sh frontend-fast-summary
    dependsOn: [frontend-build, frontend-unit-shard, frontend-property-model-perf, frontend-runtime-contracts, frontend-static-governance]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: low
    resourceClass: io
    maxParallel: 4
    requiresBootstrap: none
    requiresNode: false
    requiresDotnet: false
    requiresPlaywright: none
    cacheProfile: none
    timeoutMinutes: 5
    shardable: false
    defaultShards: 1
    risk: high
    cadence: pr
    requiredFor: fast
    coverage: []
    artifacts: [.tmp/frontend, src/frontend/dist]
    evidence: [.tmp/frontend]
    ciJob: fast-summary
    localOnly: false
    nightlyOnly: false

  - id: backend-build-governance
    owner: ServerContractAgent
    command: tools/test/lanes/backend-build-governance.sh
    dependsOn: []
    services: []
    parallelizable: true
    exclusiveResources: [static-web-assets]
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 4
    cpuUnits: 3
    memoryGiB: 3
