    cost: high
    resourceClass: browser
    maxParallel: 2
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: chromium
    playwrightWorkers: 1
    cacheProfile: full
    timeoutMinutes: 35
    shardable: true
    defaultShards: 2
    risk: high
    coverage: [ux-viewport-boundary, responsive-layout, content-boundary]
    artifacts: [.tmp/ux/viewport-smoke.json, .tmp/release-evidence/ux-viewport-summary.json, src/frontend/test-results/playwright/ux-viewport-smoke]
    evidence: [.tmp/ux/viewport-smoke.json, .tmp/release-evidence/ux-viewport-summary.json]
    ciJob: ux-viewport-smoke
    localOnly: false
    nightlyOnly: false

  - id: ux-viewport-visual
