version: fsusblog-test-matrix-v2
namespaceTemplate: ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${MATRIX_JOB:-local}-${MATRIX_SHARD:-0}
governance:
    retention:
        baseline: tests/test-retention-before.json
        replacementLedger: tests/test-retention-replacements.json
        postBaselines: [tests/issue-1146-acceptance-baseline.json]
        auditOutput: .tmp/release-evidence/test-retention-audit.json
        automaticDeletion: false
    sourceLocking:
        backendOwner: tools/check-test-suite-convergence.mjs
        frontendOwner: tests/frontend/checks/static/check-frontend-test-governance.mjs
        fixtureReaderOwners:
            - {path: tests/frontend/unit/protocol/aeds-contract.test.ts, reason: "protocol hex fixtures"}
            - {path: tests/frontend/unit/services/binaryTransport.test.ts, reason: "binary transport hex fixtures"}
            - {path: tests/frontend/unit/view-contracts/coverArt.test.ts, reason: "checked-in cover artifact fixtures"}
        delegatedOwners: []
    retiredTiers:
        - {from: backend-chaos, to: backend-concurrency, coverageIds: [backend-fault-race-readiness, backend-race-idempotency-model], reason: "backend-chaos duplicated the same Category=Concurrency selection; backend-concurrency owns the fault/race evidence."}
        - from: ux-viewport-canary-parity
          to: ux-viewport-boundaries
          coverageIds: [ux-viewport-plan-progress, ux-viewport-boundary-full, ux-viewport-visual]
          catalogReplacements:
              productionRequiredTierIds:
                  - {from: ux-viewport-canary-parity, to: ux-viewport-plan-progress}
              coverageIds:
                  - {from: ux-viewport-canary-parity, to: ux-viewport-boundary-full}
              matrixArtifactPaths:
                  - {from: .tmp/release-evidence/ux-viewport-canary-parity.json, to: .tmp/release-evidence/ux-viewport-summary.json}
                  - {from: .tmp/ux/canary-parity, to: .tmp/ux/viewport-boundaries.json}
              matrixEvidencePaths:
                  - {from: .tmp/release-evidence/ux-viewport-canary-parity.json, to: .tmp/release-evidence/ux-viewport-summary.json}
              releaseEvidencePaths:
                  - {from: .tmp/release-evidence/ux-viewport-canary-parity.json, to: .tmp/release-evidence/ux-viewport-summary.json}
          reason: "Current boundary planning, execution and visual evidence replace the incomplete historical canary parity lane."
commandGroups:
    frontend-static-governance:
        schema: "fsusblog.frontend-static-command-manifest.v2"
        lane: "frontend-static-governance"
