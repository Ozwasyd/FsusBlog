    cost: high
    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 45
    shardable: false
    defaultShards: 1
    risk: medium
    coverage: [ux-viewport-visual, screenshot-evidence]
    artifacts: [.tmp/ux/viewport-visual.json, .tmp/ux/screenshots/visual, .tmp/release-evidence/ux-viewport-summary.json, src/frontend/test-results/playwright/ux-viewport-visual]
    evidence: [.tmp/ux/viewport-visual.json, .tmp/ux/screenshots/visual, .tmp/release-evidence/ux-viewport-summary.json]
    ciJob: ux-viewport-visual
    localOnly: false
    nightlyOnly: false
    manualOnly: true

  - id: ux-viewport-boundaries
    owner: InteropGlueAgent
    command: tools/test/lanes/ux-viewport-boundaries.sh
