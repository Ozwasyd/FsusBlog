    ciJob: fast-backend
    localOnly: false
    nightlyOnly: false

  - id: backend-unit
    owner: ServerContractAgent
    command: tools/test/lanes/backend-unit.sh
    dependsOn: [backend-build-governance]
    services: []
    parallelizable: true
    exclusiveResources: []
    phase: 1
    cost: high
    resourceClass: cpu
    maxParallel: 2
    cpuUnits: 3
    memoryGiB: 3
    executionKey: backend-unit-tests
    executionVariant: ordinary
    cacheInputs: [FsusBlog.slnx, Directory.Build.props, global.json, src/backend, src/core, src/shared, tests/backend, tools/test/lanes/backend-unit.sh, tools/test/legacy-test.sh]
