  - id: cross-browser-smoke
    owner: InteropGlueAgent
    command: npm --prefix src/frontend run check:cross-browser:smoke
    dependsOn: [release]
    services: [preview]
    parallelizable: true
    exclusiveResources: [playwright-browser]
    phase: 3
    cost: high
    resourceClass: browser
    maxParallel: 2
    requiresBootstrap: frontend
    requiresNode: true
    requiresDotnet: false
    requiresPlaywright: all
    playwrightWorkers: 1
    cacheProfile: frontend
    timeoutMinutes: 20
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [cross-browser-smoke]
    artifacts: [src/frontend/test-results/playwright/cross-browser]
    evidence: [src/frontend/test-results/playwright/cross-browser]
    ciJob: cross-browser-smoke
    localOnly: false
    nightlyOnly: false

  - id: resilience
