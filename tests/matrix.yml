    resourceClass: browser
    maxParallel: 1
    requiresBootstrap: full
    requiresNode: true
    requiresDotnet: true
    requiresPlaywright: none
    cacheProfile: full
    timeoutMinutes: 35
    shardable: false
    defaultShards: 1
    risk: high
    coverage: [upload-search-notification-binary-resilience]
    artifacts: [src/frontend/test-results/playwright/resilience]
    evidence: [src/frontend/test-results/playwright/resilience]
