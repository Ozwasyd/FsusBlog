version: fsusblog-perf-policy-v1
loadProfiles:
  baseline:
    concurrency: 10
    rounds: 6
    durationMs: 30000
    maxP95Ms: 2500
    maxP99Ms: 5000
    maxErrorRate: 0
    maxTimeoutRate: 0
    minRps: 1
  expected-peak:
    concurrency: 50
    rounds: 12
    durationMs: 60000
    maxP95Ms: 3000
    maxP99Ms: 6000
    maxErrorRate: 0
    maxTimeoutRate: 0
    minRps: 1
  2x-peak:
    concurrency: 100
    rounds: 12
    durationMs: 60000
    maxP95Ms: 4000
    maxP99Ms: 8000
    maxErrorRate: 0
    maxTimeoutRate: 0
    minRps: 1
  burst:
    concurrency: 160
    rounds: 4
    durationMs: 15000
    maxP95Ms: 5000
    maxP99Ms: 10000
    maxErrorRate: 0
    maxTimeoutRate: 0
    minRps: 1
soakCacheChurn:
  minimumCycles: 2
  cycleTimeoutMs: 15000
  cleanupTimeoutMs: 15000
notificationPressure:
  connections: 50
  durationMs: 30000
  connectBatchSize: 10
  powAttempts: 30
regressionThresholds:
  nightlyPercent: 5
  releasePercent: 10
aedsFrameCost:
  schema: fsusblog.aeds-frame-cost-policy.v1
  minimumRounds: 5
  minimumWarmupIterations: 5
  minimumIterationsPerRound: 30
  authoritativeMeanAggregation: median-of-round-means
  authoritativeP95Aggregation: median-of-round-p95
  requiredRepresentativeScenarios: [ArticleList10, ArticleList50, ArticleList100, ArticleDetailLarge, CommentCursor, ConversationDetail, PublicAotBootstrap]
  staticPreencodedScenarios: [EmptySuccess]
  tinyDynamicScenarios: [ApiError]
  representative:
    maxP95RegressionPercent: 12
    maxP95RegressionMs: 0.004
    maxMeanRegressionPercent: 10
    maxMeanRegressionMs: 0.002
    maxAllocationRegressionPercent: 0
    maxAllocationIncreaseBytes: 0
  tiny:
    maxP95RegressionPercent: 35
    maxP95RegressionMs: 0.008
    maxMeanRegressionPercent: 30
    maxMeanRegressionMs: 0.004
    maxAllocationRegressionPercent: 5
    maxAllocationIncreaseBytes: 64
temporaryExceptions: []
saturationEvidence:
  schema: fsusblog.performance-saturation.v2
  evidenceKind: real
  topologies: [kestrel-only, production-topology]
  routes:
    - l0-binary-identity
    - l0-binary-br
    - l0-binary-gzip
    - l0-binary-304
    - l0-binary-head
    - l0-html-static
    - l0-html-nonce
    - l1-cache-hit
    - l2-redis-hit
    - db-miss-buffer-cold
    - db-miss-buffer-warm
    - notification-1
    - notification-100
    - notification-1000
    - browser-aeds-decode
    - browser-public-takeover
    - browser-hydration-long-task
  minimumRepeats: 3
  minimumOfferedLoadSteps: 4
  saturationFloorPercent: 85
  saturationCeilingPercent: 95
  safeHeadroomPercent: 15
  maximumErrorRate: 0.005
  maximumTimeoutRate: 0
  maximumP99AtSafeMs: 250
  maximumP999AtSafeMs: 500
  maximumThroughputVariance: 0.1
  maximumGeneratorCpuPercent: 85
  maximumGeneratorScheduleLagP99Ms: 5
  maximumEvidenceAgeHours: 24
