# OWASP ZAP baseline configuration for FsusBlog CI.
# Keep header/cookie guarantees in repo-native checks because local security
# targets include development servers. ZAP FAIL rules focus on disclosures and
# cross-origin/browser risks that should never be acceptable in any tier.
10003	FAIL	Private IP disclosure must not ship
10017	FAIL	Cross-domain JavaScript inclusion must not ship
10028	FAIL	Open redirect must not ship
10032	FAIL	Viewstate disclosure must not ship
10036	FAIL	HTTP server leakage must not ship
10038	WARN	CSP is enforced by repo-native header checks on debug targets
10049	INFO	Cache semantics are enforced by repo-native header checks; ZAP reports both cacheable and explicitly non-storable content under this id
10050	INFO	Expected feed and sitemap cache hits are validated by repo-native cache-contract checks
10055	WARN	Development/runtime CSP wildcard findings are reviewed in reports; repo-native checks enforce required CSP directives
10096	WARN	Build artifacts may contain harmless Unix-like constants; review report before release
10105	FAIL	Weak authentication method must not ship
10202	INFO	Anti-CSRF token shape is covered by SameSite, Bearer, and PoW tests
